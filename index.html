        qs.forEach(function (q) { h += qrow(q.n, '<p>' + esc(q.text) + '</p>' + radios(q.n, OPT3[g.k].map(function (o) { return [o, o]; }), 'row3')); });
      } else if (g.k === 'hd') {
        h += '<p class="inst">Reading Passage ' + (pi + 1) + ' has ' + np + ' paragraphs, A to ' + String.fromCharCode(64 + np) + '. Choose the correct heading for each paragraph from the list of headings below.</p>';
        h += '<div class="lst"><b class="t">List of headings</b><ol>' + g.heads.map(function (x, i) { return '<li><span class="k">' + ROMAN[i] + '</span><span>' + esc(x) + '</span></li>'; }).join('') + '</ol></div>';
        qs.forEach(function (q) { h += qrow(q.n, '<p>' + esc(q.text) + '</p>' + selectHTML(q.n, ROMAN.slice(0, g.heads.length))); });
      } else if (g.k === 'mi') {
        h += '<p class="inst">Which paragraph contains the following information? Choose the correct letter, A to ' + String.fromCharCode(64 + np) + '. You may use any letter more than once.</p>';
        var letters = []; for (var i = 0; i < np; i++) letters.push(String.fromCharCode(65 + i));
        qs.forEach(function (q) { h += qrow(q.n, '<p>' + esc(q.text) + '</p>' + selectHTML(q.n, letters)); });
      } else if (g.k === 'mc') {
        h += '<p class="inst">Choose the correct letter, A, B, C or D.</p>';
        g.items.forEach(function (it, i) { var q = qs[i]; h += qrow(q.n, '<p>' + esc(it[0]) + '</p>' + radios(q.n, it[1].map(function (o, j) { return [String.fromCharCode(65 + j), String.fromCharCode(65 + j) + '. ' + o]; }))); });
      } else if (g.k === 'm2') {
        h += '<p class="inst">Choose <b>TWO</b> letters, A to ' + String.fromCharCode(64 + g.opts.length) + '.</p>';
        h += qrow(qs[0].n, '<p>' + esc(g.q) + '</p><div class="opts">' + g.opts.map(function (o, j) { var L = String.fromCharCode(65 + j); return '<label><input type="checkbox" data-n="' + qs[0].n + '" value="' + L + '"><span>' + L + '. ' + esc(o) + '</span></label>'; }).join('') + '</div><p class="small">Questions ' + qs[0].n + ' and ' + qs[1].n + '</p>');
      } else if (g.k === 'cp') {
        h += '<p class="inst">Complete the sentences below. Choose ' + lim(g.limit) + ' from the passage for each answer.</p>';
        qs.forEach(function (q) { var parts = q.text.split('___'); h += qrow(q.n, '<p>' + esc(parts[0]) + '<input class="blank inl" type="text" autocomplete="off" spellcheck="false" data-n="' + q.n + '" aria-label="Answer for question ' + q.n + '">' + esc(parts[1] || '') + '</p>'); });
      } else if (g.k === 'sa') {
        h += '<p class="inst">Answer the questions below. Choose ' + lim(g.limit) + ' from the passage for each answer.</p>';
        qs.forEach(function (q) { h += qrow(q.n, '<p>' + esc(q.text) + '</p><input class="blank" type="text" autocomplete="off" spellcheck="false" data-n="' + q.n + '" aria-label="Answer for question ' + q.n + '">'); });
      } else if (g.k === 'mf') {
        var last = String.fromCharCode(64 + g.list.length);
        h += '<p class="inst">Match each statement with the correct item from the list, A to ' + last + '. You may use any letter more than once.</p>';
        h += '<div class="lst"><b class="t">' + esc(g.title) + '</b><ul>' + g.list.map(function (x, i) { return '<li><span class="k">' + String.fromCharCode(65 + i) + '</span><span>' + esc(x) + '</span></li>'; }).join('') + '</ul></div>';
        var lets = g.list.map(function (_, i) { return String.fromCharCode(65 + i); });
        qs.forEach(function (q) { h += qrow(q.n, '<p>' + esc(q.text) + '</p>' + selectHTML(q.n, lets)); });
      } else if (g.k === 'sm' || g.k === 'sb') {
        var parts2 = g.text.split('___'), out = '';
        if (g.k === 'sm') h += '<p class="inst">Complete the summary below. Choose ' + lim(g.limit) + ' from the passage for each answer.</p>';
        else {
          h += '<p class="inst">Complete the summary using the list of words, A to ' + String.fromCharCode(64 + g.bank.length) + ', below.</p>';
          h += '<div class="lst"><ul>' + g.bank.map(function (x, i) { return '<li><span class="k">' + String.fromCharCode(65 + i) + '</span><span>' + esc(x) + '</span></li>'; }).join('') + '</ul></div>';
        }
        parts2.forEach(function (t, i) {
          out += esc(t);
          if (i < qs.length) {
            var q = qs[i];
            out += g.k === 'sm'
              ? '<input class="blank inl" type="text" autocomplete="off" spellcheck="false" placeholder="' + q.n + '" data-n="' + q.n + '" aria-label="Answer for question ' + q.n + '">'
              : selectHTML(q.n, g.bank.map(function (_, j) { return String.fromCharCode(65 + j); }), 'inl').replace('<option value="">Select</option>', '<option value="">' + q.n + '</option>');
          }
        });
        h += '<div class="sumbox">' + out + '</div>';
      }
      h += '</section>';
    });
    return h;
  }

  function restoreAnswers() {
    var qp = document.getElementById('qs');
    qp.querySelectorAll('[data-n]').forEach(function (el) {
      var n = el.getAttribute('data-n'), v = S.ans[n];
      if (v == null) return;
      if (el.type === 'radio') el.checked = (el.value === v);
      else if (el.type === 'checkbox') el.checked = v.indexOf(el.value) >= 0;
      else el.value = v;
    });
  }

  function isAnswered(n) {
    var q = S.c.qs[n - 1];
    if (q.m2 === 2) { var f = S.ans[n - 1] || ''; return f.length >= 2; }
    var v = S.ans[n]; return !!(v && String(v).trim());
  }

  function onAns(e) {
    var t = e.target, n = t.getAttribute && t.getAttribute('data-n');
    if (!n) return;
    if (t.type === 'checkbox') {
      var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox][data-n="' + n + '"]'));
      var chosen = boxes.filter(function (b) { return b.checked; });
      if (chosen.length > 2) { t.checked = false; chosen = boxes.filter(function (b) { return b.checked; }); toast('Choose only two answers.'); }
      S.ans[n] = chosen.map(function (b) { return b.value; }).sort().join('');
    } else S.ans[n] = t.value;
    drawNav();
    store.drafts[S.c.id].ans = S.ans; saveStore();
  }

  function drawNav() {
    var c = S.c, h = '<div class="parts">';
    c.passages.forEach(function (p, pi) {
      var cnt = 0; for (var n = p.from; n <= p.to; n++) if (isAnswered(n)) cnt++;
      var cur = pi === S.part;
      h += '<div class="part' + (cur ? ' cur' : '') + '"><button class="ptab" data-part="' + pi + '">Part ' + (pi + 1) + '<small>' + cnt + ' of ' + (p.to - p.from + 1) + '</small></button>';
      if (cur) { h += '<div class="nums">'; for (var n2 = p.from; n2 <= p.to; n2++) h += '<button class="nb' + (isAnswered(n2) ? ' done' : '') + '" data-go="' + n2 + '" aria-label="Question ' + n2 + (isAnswered(n2) ? ', answered' : '') + '">' + n2 + '</button>'; h += '</div>'; }
      h += '</div>';
    });
    h += '</div><button class="btn pri" id="sub">Review and submit</button>';
    var nav = document.getElementById('nav'); nav.innerHTML = h;
    nav.querySelectorAll('[data-part]').forEach(function (b) { b.onclick = function () { var pi = +b.getAttribute('data-part'); if (pi !== S.part) showPart(pi); }; });
    nav.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { var el = document.getElementById('q' + b.getAttribute('data-go')) || document.getElementById('q' + (b.getAttribute('data-go') - 1)); if (el) { var sp = document.getElementById('split'); if (sp.className.indexOf('vp') >= 0 && window.innerWidth <= 860) { sp.className = 'split vq'; } el.scrollIntoView({ block: 'center' }); } }; });
    document.getElementById('sub').onclick = submitDialog;
  }

  function tick() {
    if (!S || S.done) return;
    var left = S.deadline - Date.now(), t = document.getElementById('timer');
    if (t) { t.textContent = fmt(left) + ' left'; t.className = 'timer' + (left <= 5 * 60000 ? ' dng' : left <= 10 * 60000 ? ' warn' : ''); }
    if (left <= 0) { toast('Time is up. Your answers have been submitted.'); finish(); }
  }

  function toast(msg) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200); }

  function highlight() {
    var sel = window.getSelection(); if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { toast('Select some passage text first.'); return; }
    var r = sel.getRangeAt(0), pass = document.getElementById('pass');
    if (!pass.contains(r.commonAncestorContainer)) { toast('Highlight works on the passage only.'); return; }
    try { var m = document.createElement('mark'); r.surroundContents(m); sel.removeAllRanges(); }
    catch (e) { toast('Select text inside a single paragraph.'); }
  }

  function leaveDialog() {
    var m = modal('<h2>Leave this test?</h2><p>Your answers stay saved and the timer keeps running. You can resume from the test list until time runs out.</p><div class="btns"><button class="btn" data-x="stay">Stay</button><button class="btn pri" data-x="leave">Leave test</button></div>');
    m.addEventListener('click', function (e) { var x = e.target.getAttribute && e.target.getAttribute('data-x'); if (!x) { if (e.target === m) m.remove(); return; } m.remove(); if (x === 'leave') { clearInterval(tickTimer); home(); } });
  }

  function submitDialog() {
    var un = 0; for (var n = 1; n <= 40; n++) if (!isAnswered(n)) un++;
    var m = modal('<h2>Submit your answers?</h2><p>' + (un ? 'You have <strong>' + un + '</strong> unanswered question' + (un > 1 ? 's' : '') + '.' : 'All 40 questions have an answer.') + ' You cannot change answers after submitting.</p><div class="btns"><button class="btn" data-x="back">Keep working</button><button class="btn dng" data-x="sub">Submit</button></div>');
    m.addEventListener('click', function (e) { var x = e.target.getAttribute && e.target.getAttribute('data-x'); if (!x) { if (e.target === m) m.remove(); return; } m.remove(); if (x === 'sub') finish(); });
  }

  /* ================= SCORING + RESULTS ================= */
  function mark(q, ans) {
    var key = q.m2 === 2 ? q.n - 1 : q.n, u = ans[key] || '';
    if (q.m2) {
      var sel = u.split('').filter(Boolean), good = sel.filter(function (x) { return q.ans.indexOf(x) >= 0; }).length;
      return { ok: q.m2 === 1 ? good >= 1 : good >= 2, shown: q.m2 === 1 ? sel.join(' and ') : '(see previous)' };
    }
    if (q.txt) { var nu = norm(u); return { ok: !!nu && q.ans.some(function (a) { return norm(a) === nu; }), shown: u }; }
    return { ok: u === q.ans[0], shown: u };
  }

  function finish() {
    if (!S || S.done) return;
    S.done = true; clearInterval(tickTimer);
    var c = S.c, rows = [], score = 0;
    c.qs.forEach(function (q) { var r = mark(q, S.ans); if (r.ok) score++; rows.push({ q: q, r: r }); });
    var used = Math.min(DURATION, Date.now() - S.start), b = band(score);
    var prev = store.scores[c.id];
    if (!prev || score > prev.score) store.scores[c.id] = { score: score, band: b };
    delete store.drafts[c.id]; saveStore();
    results(c, rows, score, b, used);
  }

  function results(c, rows, score, b, used) {
    var h = '<div class="res"><div class="wrap">' +
      '<p class="meta">Test ' + c.id + ' (' + c.diff + '), finished in ' + fmt(used) + ' of 60:00</p>' +
      '<div class="hero"><div class="big">' + score + '<small> / 40</small></div><div class="bandbig">Band ' + b + '</div></div>' +
      '<div class="btns" style="justify-content:flex-start;margin-bottom:24px"><button class="btn pri" id="again">Retake this test</button><button class="btn" id="back">Back to test list</button></div>' +
      '<h2 style="font:600 20px var(--ui);margin:0 0 6px">Band range for Academic Reading</h2>' +
      '<p class="small" style="margin:0">Approximate conversion from correct answers to band score. Official tests are calibrated per paper, so a result can move by up to half a band.</p>' +
      '<table class="bt"><tr><th>Correct answers (of 40)</th><th>Band</th></tr>' +
      BAND_ROWS.map(function (r) { var lo = +r[0].split('-')[0], hi = +r[0].split('-')[1]; return '<tr' + (score >= lo && score <= hi ? ' class="me"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>' +
      '<h2 style="font:600 20px var(--ui);margin:0 0 6px">Your answers</h2>' +
      '<label class="chk"><input type="checkbox" id="onlyw"> Show only questions I missed</label>' +
      '<table class="rv"><thead><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th>Result</th></tr></thead><tbody>';
    rows.forEach(function (x) {
      var q = x.q, txt = q.text.length > 90 ? q.text.slice(0, 87) + '...' : q.text;
      var alts = q.txt && q.ans.length > 1 ? '<div class="small">Also accepted: ' + esc(q.ans.slice(1).join(', ')) + '</div>' : '';
      h += '<tr class="' + (x.r.ok ? 'r' : 'w') + '"><td>' + q.n + '</td><td>' + (x.r.shown ? esc(x.r.shown) : '<span class="small">No answer</span>') + '</td><td>' + esc(q.disp) + alts + '<div class="small">' + (q.sum || q.m2 ? '' : esc(txt)) + '</div></td><td><span class="tag ' + (x.r.ok ? 'r' : 'w') + '">' + (x.r.ok ? 'Correct' : 'Missed') + '</span></td></tr>';
    });
    h += '</tbody></table></div></div>';
    app.innerHTML = h;
    document.getElementById('again').onclick = function () { begin(c.id, null); };
    document.getElementById('back').onclick = home;
    document.getElementById('onlyw').onchange = function (e) { app.querySelectorAll('.rv tbody tr.r').forEach(function (tr) { tr.style.display = e.target.checked ? 'none' : ''; }); };
    window.scrollTo(0, 0);
  }

  window.__sim = { home: home, begin: begin, finish: finish, getS: function () { return S; }, COMPILED: COMPILED, mark: mark, band: band };
  home();
})();
</script>
</body>
</html>
