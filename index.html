<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Academic Reading Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#17212b; --muted:#566370; --line:#d3d9df; --line-soft:#e6eaee;
  --brand:#1c5aa6; --brand-ink:#ffffff; --brand-soft:#e4edf8;
  --bar:#1d2630; --bar-ink:#eef2f5;
  --ok:#17703f; --ok-soft:#e1f2e8; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#a05a00; --warn-soft:#fdf0d9;
  --mark:#ffe58a; --fs:17px;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#18212a; --ink:#e7ecf1; --muted:#9aa8b5; --line:#2d3945; --line-soft:#232d37;
    --brand:#6fa8ee; --brand-ink:#0a1621; --brand-soft:#1c2d42;
    --bar:#0a0f14; --bar-ink:#e7ecf1;
    --ok:#58c78c; --ok-soft:#14301f; --bad:#ff8d83; --bad-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#38290e;
    --mark:#6e5c10;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7ecf1; --muted:#9aa8b5; --line:#2d3945; --line-soft:#232d37;
  --brand:#6fa8ee; --brand-ink:#0a1621; --brand-soft:#1c2d42;
  --bar:#0a0f14; --bar-ink:#e7ecf1;
  --ok:#58c78c; --ok-soft:#14301f; --bad:#ff8d83; --bad-soft:#3a1a18; --warn:#f0b35a; --warn-soft:#38290e;
  --mark:#6e5c10;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- home ---------- */
.home{height:100%;overflow:auto}
.wrap{max-width:900px;margin:0 auto;padding:40px 24px 64px}
.home h1{font:600 32px/1.15 var(--ui);margin:0 0 10px;letter-spacing:-.01em}
.home .lede{color:var(--muted);max-width:60ch;margin:0 0 28px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:8px}
.seg button{border:0;background:transparent;padding:10px 18px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.levelnote{color:var(--muted);margin:6px 0 18px;font-size:14px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 8px;color:inherit}
.row:hover{background:var(--surface)}
.row .no{font:600 34px/1 var(--ui);color:var(--brand)}
.row .tt{display:flex;flex-direction:column;gap:2px}
.row .tt b{font-weight:500}
.row .st{font-size:13px;color:var(--muted);text-align:right;min-width:120px}
.row .st strong{display:block;color:var(--ink);font-weight:600}
.row .st em{font-style:normal;color:var(--warn);font-weight:600}
.foot-note{margin-top:28px;color:var(--muted);font-size:13px;max-width:70ch}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);color:var(--ink);border-radius:10px;max-width:460px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg h2{margin:0 0 8px;font:600 20px var(--ui)}
.dlg p{margin:0 0 12px;color:var(--muted)}
.dlg ul{margin:0 0 16px;padding-left:20px;color:var(--muted)}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px;font-weight:500}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.dng{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ---------- test shell ---------- */
.top{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.top .ttl{font-weight:600;margin-right:auto}
.top .ttl small{font-weight:400;opacity:.75;margin-left:8px}
.timer{font:600 18px var(--ui);font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:6px;background:rgba(255,255,255,.1);min-width:150px;text-align:center}
.timer.warn{background:var(--warn);color:#fff}
.timer.dng{background:var(--bad);color:#fff}
.tool{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--bar-ink);border-radius:6px;padding:5px 10px;font-size:14px}
.tool:hover{background:rgba(255,255,255,.12)}
.mtabs{display:none;background:var(--surface);border-bottom:1px solid var(--line)}
.mtabs button{flex:1;border:0;background:transparent;padding:10px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.mtabs button[aria-pressed="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.split{flex:1;min-height:0;display:flex}
.pane{flex:1 1 50%;min-width:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);padding:22px 28px 40px}
.pane.pass{border-right:2px solid var(--line)}
.pane.qs{background:var(--surface)}
.pass h2{font:600 20px/1.3 var(--ui);margin:0 0 4px}
.pass .rp{color:var(--muted);font-size:13px;margin:0 0 4px}
.pass .tm{color:var(--muted);font-style:italic;margin:0 0 18px;font-size:14px}
.pass p.pp{font:400 var(--fs)/1.72 var(--serif);margin:0 0 14px;max-width:68ch}
.pass .pl{display:inline-block;min-width:1.7em;font:600 14px var(--ui);color:var(--brand);margin-right:6px}
mark{background:var(--mark);color:inherit;cursor:pointer;border-radius:2px}
.grp{margin:0 0 30px}
.grp h3{font:600 17px var(--ui);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp .inst{color:var(--muted);margin:6px 0}
.grp .inst b{color:var(--ink)}
.key{margin:8px 0 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:var(--muted);font-size:14px}
.key dt{font-weight:600;color:var(--ink)}
.key dd{margin:0}
.lst{margin:10px 0 14px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lst b.t{display:block;margin-bottom:4px}
.lst ol,.lst ul{margin:0;padding:0;list-style:none}
.lst li{display:flex;gap:10px;padding:2px 0}
.lst li span.k{min-width:2em;font-weight:600;color:var(--brand)}
.q{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.q:last-child{border-bottom:0}
.qn{flex:0 0 auto;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--brand-soft);color:var(--brand);font-weight:600;display:flex;align-items:center;justify-content:center}
.qb{flex:1;min-width:0}
.qb p{margin:2px 0 6px}
.opts{display:flex;flex-direction:column;gap:4px}
.opts.row3{flex-direction:row;flex-wrap:wrap;gap:6px 16px}
.opts label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:2px 0}
.opts input{margin-top:5px}
select.sel,input.blank{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:6px 8px}
select.sel{min-width:120px}
input.blank{width:min(220px,100%);display:inline-block}
input.blank.inl{width:150px;margin:0 4px}
select.inl{margin:0 4px}
.sumbox{line-height:2.2;padding:6px 0}

/* ---------- footer nav ---------- */
.nav{background:var(--surface);border-top:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nav .parts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1}
.part{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.part.cur{border-color:var(--brand);background:var(--surface)}
.ptab{border:0;background:transparent;font-weight:600;padding:4px 6px}
.ptab small{font-weight:400;color:var(--muted);margin-left:6px}
.nums{display:flex;gap:4px;flex-wrap:wrap}
.nb{min-width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:13px;font-weight:500}
.nb.done{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:8px 14px;border-radius:6px;font-size:14px;z-index:30}

/* ---------- results ---------- */
.res{height:100%;overflow:auto}
.hero{display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 24px}
.big{font:600 64px/1 var(--ui);letter-spacing:-.02em}
.big small{font-size:24px;color:var(--muted);font-weight:500}
.bandbig{font:600 64px/1 var(--ui);color:var(--brand)}
.meta{color:var(--muted);margin:0 0 4px}
.bt{border-collapse:collapse;margin:12px 0 28px;width:100%;max-width:520px}
.bt th,.bt td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left}
.bt tr.me td{background:var(--brand-soft);font-weight:600}
.rv{width:100%;border-collapse:collapse;font-size:14px}
.rv th{text-align:left;padding:8px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600}
.rv td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.rv tr.w td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.rv tr.r td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tag{font-weight:600}
.tag.r{color:var(--ok)} .tag.w{color:var(--bad)}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0}
.small{font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .mtabs{display:flex}
  .split{position:relative}
  .pane{flex:1 1 100%;padding:16px}
  .split.vp .pane.qs{display:none}
  .split.vq .pane.pass{display:none}
  .pane.pass{border-right:0}
  .row{grid-template-columns:44px 1fr}
  .row .st{grid-column:2;text-align:left}
  .wrap{padding:24px 16px 48px}
  .home h1{font-size:26px}
  .timer{min-width:0}
  .big,.bandbig{font-size:48px}
}
@media print{.top,.nav{display:none}}
</style>

<script>
var L=function (i) { return String.fromCharCode(65 + i); };var CODE={"T":"TRUE","F":"FALSE","NG":"NOT GIVEN","Y":"YES","N":"NO"};var ROMAN=["i","ii","iii","iv","v","vi","vii","viii","ix","x"];var norm=function norm(s) {

      if (g.k === 'mi') g.items.forEach(function (it) { add({ text: it[0], ans: [it[1]], disp: it[1], para: it[1] }); });
      if (g.k === 'mc') g.items.forEach(function (it) { add({ text: it[0], ans: [it[2]], disp: it[2] + '. ' + it[1][it[2].charCodeAt(0) - 65], opts: it[1], mc: it[2] }); });
      if (g.k === 'm2') { add({ text: g.q, ans: g.ans.split(''), disp: g.ans.split('').join(' and '), m2: 1 }); add({ text: g.q, ans: g.ans.split(''), disp: g.ans.split('').join(' and '), m2: 2 }); }

var TESTS = [{"id":1,"diff":"Medium","passages":[{"title":"The Return of the Beaver","paras":["Beavers were once common across Europe and Asia. By the early twentieth century, hunting for fur and for castoreum, a secretion used in perfume and traditional medicine, had left only a few small populations, and in Britain the animal had been absent for about 400 years. At the time, few people understood how much the loss had changed the rivers it left behind.","Reintroduction began in Sweden in the 1920s and spread across the continent. The first releases were small and closely monitored, because nobody was sure how the animals would behave in a landscape that had been farmed for centuries. They did well. Today about 1.5 million Eurasian beavers live in Europe, and the species is no longer considered threatened.","The beaver's main effect on a river comes from its dams, which it builds from branches, mud and stones. A dam slows a stream and spreads water across the surrounding land, creating ponds and wet ground where there was once a narrow channel. Water held in this way is released slowly during dry weather. Dams also cause sediment to settle before the water moves downstream, so the river below runs clearer.","Wildlife responds quickly to these new wetlands. Surveys in several countries have recorded more amphibians, dragonflies, fish and waterbirds around beaver ponds than along comparable stretches of unmodified stream. Trees that die when their roots are flooded stay standing for years, and woodpeckers cut nesting holes in them that other birds later use.","Not everyone welcomes the animal. Beavers fell trees, flood fields and block culverts, and landowners have good reasons to complain. Wildlife managers now offer practical fixes. Flow devices, which are pipes that let water pass through a dam at a fixed level, keep ponds from rising too high, and wire mesh around the trunks of valuable trees stops them being gnawed.","England provided a test case. Wild beavers were discovered on the River Otter in Devon around 2014, though nobody could say how they got there. Rather than removing them, the government allowed a five-year trial. Researchers measured a fall in peak flood flow in a village downstream, and in 2020 the animals were given permission to stay."],"groups":[{"k":"hd","heads":["Why a lost animal mattered more than expected","The slow return across a continent","How dams change the flow of water","Wildlife that benefits from new wetlands","A conflict with landowners and its remedies","A British experiment and its outcome","The fur trade in the nineteenth century","Beavers as a danger to other mammals"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Beavers had been absent from Britain for roughly four centuries.","T"],["The first beaver releases in Europe were large and left unmonitored.","F"],["Beaver ponds have lowered the cost of treating drinking water in Europe.","NG"]]},{"k":"cp","limit":"TWO WORDS","items":[["Beavers were hunted for their fur and for ___, which was used in perfume.","castoreum"],["A dam spreads water across the ___.","surrounding land"],["Woodpeckers cut ___ in dead trees that other birds later use.","nesting holes"],["___ let water pass through a dam at a fixed level.","flow devices"]]}]},{"title":"Why Cities Need Street Trees","paras":["On a hot afternoon, the difference between a tree-lined street and a bare one is something pedestrians feel at once. Measurements show that a surface in shade can be 10 to 20 degrees Celsius cooler than the same surface in full sun, and shaded pavement also stores less heat to release after dark. For this reason, many city governments now treat street trees as part of their plan for coping with heatwaves, not as decoration.","Trees also deal with water. Rain that lands on a canopy is held on leaves and branches and evaporates before it reaches the ground, and roots draw up much of the rest. A single mature tree can intercept thousands of litres of rainfall in a year, which eases the load on storm drains during heavy downpours.","The effect on air quality is smaller than many people assume. Leaves do capture fine dust, and a belt of trees between a road and a footpath lowers the amount that reaches walkers. But trees cannot clean the air of a city on their own, and some species release pollen or chemical compounds that worsen the problem for people with asthma. Cutting traffic remains more effective than planting.","Growing a street tree is harder than growing one in a park. Many are planted in small pits surrounded by compacted soil, with little room for roots, and the roots that do spread often lift paving stones and damage drains. Engineers have developed soil cells, which are strong plastic frames that hold up the pavement while leaving open space filled with soil underneath. Trees planted this way typically survive longer, although the method costs more at the start.","Planning has also changed. Dutch elm disease killed millions of elm trees across Europe and North America in the twentieth century, and many cities had planted little else along their streets. Today most urban foresters limit any one species to a small share of the total. Some cities set canopy targets, such as 30 percent of land area, and studies have linked street greenery with lower reported stress among residents."],"groups":[{"k":"mi","items":[["A comparison between shaded and unshaded surfaces","A"],["The reason cities avoid planting a single species","E"],["A limit on how far trees can improve air quality","C"],["An engineering solution to the problem of cramped roots","D"],["A description of how trees reduce pressure on drains","B"]]},{"k":"mc","items":[["What does the writer say about tree roots in paragraph D?",["They are the main reason young trees die.","They can lift paving and damage drains.","They take pollutants out of the soil.","They grow best in compacted soil."],"B"],["In paragraph C, the writer suggests that, for air quality,",["planting trees is the most effective measure available.","reducing traffic matters more than planting trees.","trees do more harm than good.","the evidence for trees is still weak."],"B"],["Soil cells are used to",["hold up pavements while leaving space for roots.","keep roots away from pipes using chemicals.","water trees automatically.","cut the cost of paving."],"A"],["The writer mentions Dutch elm disease to show",["why elms are unsuitable for streets.","the risk of relying on a single species.","that diseases spread faster in cities.","how quickly lost canopy can be replaced."],"B"]]},{"k":"sa","limit":"THREE WORDS","items":[["What do leaves capture from the air?","fine dust|dust"],["What canopy target do some cities set?","30 percent|30%|30 per cent"],["What type of surface stores less heat when it is shaded?","pavement"],["What has been linked with lower reported stress?","street greenery|greenery"]]}]},{"title":"The Origins of Standardised Time","paras":["Until the nineteenth century, every town set its own time. Noon was the moment the sun stood highest, so a clock in Bristol ran about ten minutes behind one in London. Nobody minded, because journeys were slow and few people needed to know what time it was somewhere else.","Railways changed that. A timetable only works if every station agrees on the hour, and in the 1840s the Great Western Railway adopted London time for its whole network. Some towns resisted. The Corn Exchange in Bristol put a second minute hand on its clock so that it could show both local time and London time, and it still has two.","The difficulty was greater in North America. By the 1880s, American railways were working to about fifty different standards, and a traveller crossing the continent had to adjust a watch many times. On 18 November 1883, the railways introduced four time zones across the continent. Newspapers called it the day of two noons, because in many cities clocks were reset and noon came twice.","A global system took longer. In 1884, delegates from twenty-five countries met in Washington and voted to make the line through Greenwich the prime meridian. France abstained, and it did not adopt Greenwich-based time for its own use until 1911. The decision gave the world a common reference point, but it did not oblige any country to change its clocks.","Even within countries, adoption was uneven. In the United States, railway time had no legal force for decades, and the Standard Time Act, which made the zones official for the whole country, was not passed until 1918. That law also introduced daylight saving time.","Today the reference is not the sun but atomic clocks. Coordinated Universal Time is calculated from a network of atomic clocks, and because the Earth's rotation is slightly irregular, leap seconds have been added since 1972 to keep it close to astronomical time. In 2022 metrologists agreed to stop adding them by 2035."],"groups":[{"k":"tf","items":[["Before the nineteenth century, most towns set their time by the position of the sun.","T"],["Bristol altered its Corn Exchange clock so that it showed only London time.","F"],["Every country at the 1884 conference voted for Greenwich.","F"],["Leap seconds were first proposed by an international committee of physicists.","NG"]]},{"k":"mf","title":"List of organisations and events","list":["The Great Western Railway","North American railways","The 1884 conference","France","The Standard Time Act"],"items":[["adopted London time for all of its stations in the 1840s","A"],["introduced four time zones in 1883","B"],["chose Greenwich as the prime meridian","C"],["did not use Greenwich-based time until 1911","D"],["also introduced daylight saving time","E"]]},{"k":"cp","limit":"TWO WORDS","items":[["In Bristol, the clock ran about ___ behind the one in London.","ten minutes"],["By the 1880s, American railways used about ___ different standards.","fifty"],["Newspapers called 18 November 1883 the day of ___.","two noons"],["The 1884 meeting took place in ___.","Washington"],["Coordinated Universal Time is calculated from a network of ___.","atomic clocks"]]}]}]},{"id":2,"diff":"Medium","passages":[{"title":"How Coffee Conquered the World","paras":["Coffee grows wild in the highlands of southwestern Ethiopia. The earliest firm evidence of people drinking it comes from Yemen, where the plant was being cultivated by the fifteenth century. Sufi monks there drank it to stay awake during night-time prayers, and from the monasteries it spread to the merchants of the port of Mocha.","By the sixteenth century, coffeehouses had opened in Mecca, Cairo and Istanbul. They became places where men met to talk, play chess and listen to music, and some rulers distrusted them for exactly that reason. Several tried to close them, though never for long.","Coffee reached Europe through Venetian traders in the seventeenth century. In England, coffeehouses charged a penny for entry, and for that price a customer received a cup and access to conversation and newspapers. They were nicknamed penny universities. Several financial institutions in London began as groups of men who met regularly in particular coffeehouses to trade information.","Demand soon outstripped what Yemen could supply, and European powers looked for places to grow their own. The Dutch established plantations in Java in the 1690s, and the French carried seedlings to Caribbean colonies in the 1720s. Brazil began growing coffee at about the same time and, by the middle of the nineteenth century, produced more than any other country. Plantation labour, much of it enslaved, made the low prices possible.","Coffee is now one of the most widely traded commodities in the world, and a large share is still grown by smallholders on plots of a few hectares. Because the price is set on international markets, a poor harvest in Brazil can alter the income of a farmer thousands of kilometres away."],"groups":[{"k":"tf","items":[["Coffee plants grow wild in parts of Ethiopia.","T"],["The Sufi monks of Yemen were the first people to cultivate coffee on a large scale.","NG"],["Every ruler who disliked coffeehouses closed them permanently.","F"],["An English coffeehouse customer paid a penny for a cup and access to newspapers.","T"],["The French were the first Europeans to establish coffee plantations.","F"],["By the middle of the nineteenth century, Brazil was the largest coffee producer.","T"]]},{"k":"mc","items":[["Why did some rulers distrust coffeehouses?",["They were places where people could meet and talk freely.","They sold coffee at prices that undercut merchants.","They were run by foreign traders.","They stayed open during prayer times."],"A"],["What does the writer say about London coffeehouses?",["They were the first places in Europe to sell newspapers.","Some financial institutions grew out of groups that met in them.","They were more popular than those in Istanbul.","They charged more than a penny for coffee."],"B"],["What is the writer's main point in paragraph E?",["Coffee is no longer grown in Yemen.","Brazil controls the global price of coffee.","Growers' incomes depend on prices set far away.","Smallholdings are replacing plantations."],"C"]]},{"k":"cp","limit":"TWO WORDS","items":[["The coffee plant was being cultivated in ___ by the fifteenth century.","Yemen"],["Coffeehouses in England were nicknamed ___.","penny universities"],["The Dutch established plantations in ___ in the 1690s.","Java"],["Coffee is one of the most widely traded ___ in the world.","commodities"]]}]},{"title":"Sleep and Teenage Learning","paras":["Ask a teenager to go to bed at ten and you may be asking for something their biology resists. During puberty the body clock shifts: the brain releases melatonin, the hormone that signals sleepiness, about one to two hours later than it does in childhood or adulthood. A teenager who is wide awake at eleven is not simply being awkward. Yet teenagers are advised to sleep between eight and ten hours, and many get far less.","The cost shows up in school. Sleep is when the brain strengthens new memories, so a student who studies late and then sleeps little may remember less of what was learned. Tired students also concentrate for shorter periods, and some research links chronic sleep loss with low mood. Teachers often say that first lessons produce the weakest work.","A trial in Seattle tested a simple remedy. In 2016 the city moved the start of high school from 7.50 to 8.45 a.m. Researchers who compared students before and after the change found that they slept 34 minutes longer each night, and that median grades rose by 4.5 percent. Attendance improved as well, and fewer students arrived late.","Critics raise practical objections. Later starts mean later finishes, which can clash with sports practice, part-time jobs and the care of younger siblings. Bus routes planned around one start time may need rebuilding, and that costs money. These problems are real, though districts that have made the change have generally found ways to manage them.","Parents and teenagers can also change habits. Dimming lights and putting phones away in the hour before bed helps some students fall asleep sooner, although evidence that screens alone cause the shortage is mixed. Weekend lie-ins do not repay a weekday deficit, since they push the body clock later still. On balance, the Seattle results suggest that changing school timetables is the intervention with the strongest support."],"groups":[{"k":"yn","items":[["Teenagers who stay awake late at night are usually being deliberately uncooperative.","N"],["Many teenagers sleep less than the recommended amount.","Y"],["The practical difficulties of later school starts have been exaggerated by critics.","N"],["Girls are more affected by sleep loss than boys.","NG"],["Changing school timetables has the strongest support of the measures discussed.","Y"]]},{"k":"mi","items":[["A reference to a change in the hormone that signals sleepiness","A"],["An explanation of why lost sleep may affect memory","B"],["A description of costs that school districts may face","D"],["A statement that sleeping late at weekends does not solve the problem","E"]]},{"k":"sm","limit":"TWO WORDS AND/OR A NUMBER","text":"In 2016 Seattle moved the start of high school from 7.50 to ___ a.m. Afterwards students slept ___ longer each night, median grades rose by ___ percent, and ___ improved as well.","answers":["8.45","34 minutes","4.5","attendance"]}]},{"title":"Floating Solar Farms","paras":["Solar power needs space, and space is expensive. A large solar farm can cover several square kilometres, and in crowded countries land that might house farms or homes is rarely free. One answer is to put the panels on water instead. Floating solar farms rest on plastic platforms anchored in reservoirs, lakes and old quarry pits.","The idea spread first in Japan, where flat land is scarce. After the 2011 earthquake and the closure of nuclear plants, utilities there built dozens of floating arrays on irrigation ponds, and engineers in other countries watched the results. China, India and South Korea soon followed, and Singapore opened a large installation on the Tengeh Reservoir in 2021.","Water brings technical advantages. Panels lose efficiency as they heat up, and the water beneath a floating array keeps them a little cooler, which can raise output by a few percent compared with the same panels on dry land. The panels also shade the water, which reduces evaporation. In hot countries with water shortages, that can matter as much as the electricity.","Many reservoirs already have power lines because they sit behind hydropower dams. Floating panels can use that connection. The two sources also complement each other. Solar generates when the sun shines, and the dam can hold back water at those times, releasing it at night or when the weather is cloudy.","Floating farms are not simple to build. Platforms must withstand wind and waves, and the anchor lines have to cope with water levels that rise and fall through the year. Salt water corrodes metal parts quickly, so most projects so far have been on fresh water. Construction costs are typically higher than for panels on land.","Ecologists urge caution. A thick layer of panels cuts the sunlight reaching the water, which can slow the growth of algae, and that affects the fish and birds that feed on it. Most developers now cover only part of a reservoir and monitor oxygen levels and wildlife. Whether partial cover avoids harm over many years is not yet known."],"groups":[{"k":"hd","heads":["A shortage of land and a possible solution","Early adopters and the countries that followed","Gains from cooler panels and reduced evaporation","Using existing power lines and complementary supply","Engineering difficulties and extra expense","Concerns about effects on living things","Reasons for the decline of nuclear power","The use of salt water in desalination"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"mc","items":[["Why did Japan lead the way in floating solar?",["It has the largest reservoirs in Asia.","Flat land is scarce there.","Its panels were cheaper than elsewhere.","Ground-mounted farms were banned."],"B"],["According to paragraph C, panels on water",["cost less to maintain than panels on land.","can produce slightly more electricity than panels on land.","stop evaporation completely.","last twice as long as panels on land."],"B"],["The writer says solar power and hydropower fit together because",["dams can hold back water while the sun is shining.","dams produce power only at night.","solar panels cool the water behind dams.","both depend on the same weather."],"A"],["What does paragraph F say about partial cover of a reservoir?",["It has been proved harmless.","Its long-term effect is not yet known.","It is banned in most countries.","It doubles the algae in the water."],"B"]]},{"k":"cp","limit":"TWO WORDS","items":[["Floating solar farms rest on ___ anchored in reservoirs.","plastic platforms"],["Panels lose ___ as they heat up.","efficiency"],["Salt water corrodes metal parts quickly, so most projects so far have been on ___ water.","fresh"],["Developers monitor ___ levels and wildlife.","oxygen"]]}]}]},{"id":3,"diff":"Medium","passages":[{"title":"How Honeybees Find Their Way","paras":["A honeybee can forage several kilometres from its hive and return to it without hesitation. For decades, scientists tried to work out how an insect with a brain the size of a sesame seed manages this. The answer turned out to involve three separate tools: the sun, patterns in the sky, and memory of the landscape.","The sun is the bee's main compass. Bees keep track of its position even when it is hidden by cloud, because the light of the sky is polarised in a pattern that shifts predictably across the day. Bees can detect this pattern, which is invisible to humans, and use it to find the direction of the sun when only a patch of blue sky is visible.","Bees also remember what they have seen. Experiments in which hives were moved to unfamiliar sites showed that foragers gradually built a mental map, using trees, buildings and field edges as landmarks. If researchers captured a bee at a feeding site and released it somewhere else, it often flew first in the direction it had been heading, and then began searching in loops until it recognised a familiar view.","Navigation matters because bees share what they find. A forager that has located a good source of nectar returns to the hive and performs a waggle dance. The angle of the dance relative to vertical shows the direction of the food relative to the sun, and the length of the waggling part signals the distance. Other bees follow the dancer closely and fly out to the same place.","Dances are not always accurate, and that may be useful. When a source turns out to be poor, the colony soon stops recruiting to it, because dancers returning from it dance less enthusiastically. The system as a whole corrects itself without any bee needing to know the whole picture.","Modern threats complicate all this. Some pesticides reduce a bee's ability to return to the hive, and bees exposed to them take longer on each trip and are more likely to get lost. Researchers who tracked exposed bees with tiny radar tags found that they were more likely to fail to return at all."],"groups":[{"k":"hd","heads":["The tools bees use to navigate","Finding direction when the sun cannot be seen","Building a picture of the landscape","How food sources are communicated","A built-in way of correcting mistakes","Chemicals that disturb navigation","The size of the bee brain","How hives are protected from predators"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Bees can detect a pattern in the sky that humans cannot see.","T"],["Bees released at a new site always search at random.","F"],["The length of the waggling part of the dance shows how far away the food is.","T"],["Bees dance more enthusiastically when a food source is poor.","F"]]},{"k":"cp","limit":"TWO WORDS","items":[["A honeybee's brain is about the size of a ___.","sesame seed"],["Bees use trees, buildings and field edges as ___.","landmarks"],["The angle of the dance relative to vertical shows the ___ of the food.","direction"]]}]},{"title":"The Rise of Microfinance","paras":["In 1976 an economist in Bangladesh lent a small sum of money to forty-two villagers who made bamboo furniture. The sum was about 27 dollars in total, but it freed the villagers from moneylenders who charged very high interest. The economist was Muhammad Yunus. The experiment grew into the Grameen Bank, and in 2006 Yunus and the bank shared the Nobel Peace Prize.","Traditional banks had avoided poor customers for good reasons. Small loans cost almost as much to administer as large ones, borrowers had no property to offer as security, and many could not read the paperwork. Grameen answered each problem. It lent to groups of five women, who guaranteed each other's repayments, and loan officers visited villages weekly rather than expecting customers to travel to a branch.","Lenders reported repayment rates above 95 percent, and the model spread quickly. By the early 2000s, microfinance institutions operated in over a hundred countries, and the United Nations declared 2005 the International Year of Microcredit. Investors from rich countries began to see lending to the poor as both a moral cause and a business.","Then the doubts grew. Economists who ran randomised trials, giving some communities access to microloans and others none, found that on average the loans did not lift many families out of poverty. Borrowers started small businesses, but most were tiny and rarely grew. The effect on household income was modest, although families did report smoother spending during hard months.","There were darker stories too. In some regions, competition between lenders encouraged people to take loans from several sources, and repayment pressure led to distress. In 2010, a crisis in the Indian state of Andhra Pradesh followed reports of aggressive collection practices, and the state government introduced restrictions on lenders.","Today the field is quieter and more cautious. Many institutions now offer savings accounts and insurance alongside loans, since evidence suggests that a safe place to keep money may help poor families more than credit does. Supporters still argue that microfinance works best as one tool among several rather than as a cure for poverty."],"groups":[{"k":"yn","items":[["Muhammad Yunus's first loans were large enough to transform the whole village economy.","N"],["Under the Grameen model, borrowers guaranteed one another's repayments.","Y"],["Randomised trials showed that microloans reduced poverty dramatically.","N"],["Microfinance should be abandoned because it does not work.","NG"],["The Andhra Pradesh crisis led to action by the state government.","Y"],["Women repay loans more reliably than men in every country.","NG"]]},{"k":"mf","title":"List of terms from the passage","list":["Group lending","Weekly village visits","Savings accounts","Randomised trials","Moneylenders"],"items":[["gave borrowers a reason to guarantee one another","A"],["removed the need for customers to travel to a branch","B"],["are now offered by many institutions alongside loans","C"],["compared communities with and without access to loans","D"]]},{"k":"sm","limit":"TWO WORDS","text":"The first loans in 1976 helped villagers escape ___ who charged very high interest. Later studies found that the effect on ___ was modest, although families reported smoother ___ in hard months. Many institutions now also offer savings accounts and ___.","answers":["moneylenders","household income","spending","insurance"]}]},{"title":"Restoring Medieval Manuscripts","paras":["A medieval manuscript is a fragile object. Most were written on parchment, which is made from animal skin, and parchment reacts to its surroundings. It swells in damp air and shrinks in dry air, and the ink and pigments on its surface can flake as it moves. Conservators spend their careers learning to stop that process without causing harm of their own.","The first principle of conservation is reversibility. A treatment should be one that a later conservator could undo, in case better methods are developed. This rules out some practices that were common in the past. In the nineteenth century, owners sometimes washed pages with strong chemicals to make the text clearer, and the damage from those treatments is visible today.","Cleaning is done by hand. Surface dirt is removed with soft brushes and special sponges made of vulcanised rubber, which lift dust without wetting the page. Where stains must be treated, conservators use tiny amounts of solvent applied with a swab, testing a hidden corner first. Repairs to tears use thin Japanese tissue and wheat starch paste, both of which are weak enough to be removed later.","Technology now helps with the reading as well. Many manuscripts contain texts that were scraped off so the parchment could be reused. The faint traces of the original writing can be recovered by photographing the page under different wavelengths of light, from ultraviolet to infrared, and combining the images on a computer. This technique has revealed lost works of ancient mathematics and previously unknown prayers.","Digitisation has changed access. Libraries now photograph rare manuscripts at high resolution and publish them online, so scholars no longer need to travel and the originals are handled less often. Yet curators point out that a digital copy cannot capture everything. The weight of a binding, the smell of the leather and the texture of the parchment are part of what a manuscript is.","Storage matters as much as treatment. The ideal conditions are cool, with relative humidity kept steady at around 50 percent, and with little light. Many libraries keep their oldest books in dark vaults and display them only for short periods, replacing the pages on show every few months."],"groups":[{"k":"hd","heads":["The material and why it is vulnerable","A rule that guides all treatment","Methods for cleaning and mending","Recovering text that has been erased","Making manuscripts available online","Keeping books in stable conditions","The history of paper production","Forgery in the medieval book trade"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Parchment is made from animal skin.","T"],["Nineteenth-century treatments with strong chemicals had no lasting effect on manuscripts.","F"],["Conservators test a solvent on a hidden corner before using it on a stain.","T"],["Infrared photography is more effective than ultraviolet photography at recovering erased text.","NG"]]},{"k":"sa","limit":"TWO WORDS","items":[["What are the cleaning sponges made of?","vulcanised rubber"],["Which material is used with wheat starch paste to repair tears?","Japanese tissue"],["What level of relative humidity is ideal for storage?","50 percent|50%|50 per cent"]]}]}]},{"id":4,"diff":"Medium","passages":[{"title":"The Science of Tsunami Warning","paras":["Most tsunamis begin on the seabed. In subduction zones, one tectonic plate slides beneath another, and the plates can lock together for centuries while stress builds. When they finally slip, the seafloor above can jump upward by several metres in seconds, lifting the entire column of water above it. Landslides and volcanic eruptions can also generate tsunamis, but earthquakes cause the large majority.","In deep water a tsunami is easy to miss. Its height may be under a metre, but its wavelength can exceed 100 kilometres and it travels at close to 800 kilometres an hour, about as fast as a jet airliner. A ship passing over one would hardly notice it. As the wave enters shallow water near the coast it slows down, and the energy that was spread through the depth of the ocean is squeezed into a smaller volume, so the wave grows in height.","The 2004 Indian Ocean tsunami showed what happens without a warning system. An earthquake off Sumatra killed about 230,000 people in fourteen countries, many of them hours of travel from the source. Coastlines as far away as East Africa were struck hours after the earthquake, yet no alert reached most of the people living on them.","A warning network has two parts. Seismometers detect an earthquake within minutes and give its location and size, but they cannot say whether it displaced the seabed. That is the job of pressure sensors anchored on the ocean floor. A passing tsunami raises the pressure on the sensor slightly, and the sensor passes the reading to a surface buoy, which relays it by satellite to warning centres. The system is known as DART.","Technology only helps if people can act on it. For communities close to the source, the wave may arrive within ten to twenty minutes, too soon for any official message. Coastal residents in many countries are taught that long or strong shaking, or a sudden retreat of the sea, is itself the warning, and that they should move to high ground without waiting for instructions.","Warnings carry costs. An evacuation can disrupt a city for a day and cost millions, and an alert that proves unnecessary may make people slower to respond the next time. Warning centres therefore try to issue graded alerts, from a watch to an advisory to a full warning, so that the response matches the real threat."],"groups":[{"k":"hd","heads":["How the seabed starts a wave","Why a wave looks harmless at sea and dangerous on land","A disaster that exposed a gap","The equipment behind early detection","Why people must sometimes act without an alert","The price of false alarms","Tsunami defences built from concrete","The role of volcanoes in global cooling"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Landslides can cause tsunamis.","T"],["A tsunami in deep water is usually higher than one near the shore.","F"],["Most people on the coasts struck in 2004 received an alert.","F"],["DART buoys were first installed in the Pacific Ocean.","NG"]]},{"k":"cp","limit":"TWO WORDS AND/OR A NUMBER","items":[["In a subduction zone the plates can ___ for centuries while stress builds.","lock together"],["A tsunami in deep water travels at close to ___ kilometres an hour.","800"],["Warning centres issue graded alerts, from a watch to an advisory to a ___.","full warning"]]}]},{"title":"Learning a Second Language as an Adult","paras":["Many adults believe that the chance to learn a language well closed when they left childhood. The belief has a scientific name, the critical period hypothesis, and it rests on real observations: children who move abroad usually end up speaking with the accent of their new home, while adults almost never lose their original one.","But the evidence is less one-sided than that suggests. Adults learn faster than children in the early stages, because they can use reading, grammar rules and strategies for memorising vocabulary. A large online study of more than 600,000 people found that the ability to learn grammar stays high until about the age of seventeen, much later than researchers had expected, and declines only slowly after that.","What adults lack is usually time, not ability. A child in a new country spends most of the day surrounded by the language, in classrooms and playgrounds, whereas an adult may meet it for a few hours a week. Studies that measure total exposure find that learners who put in comparable hours progress at comparable rates, whatever their age.","Method matters too. Spaced repetition, in which a word is reviewed just before it would be forgotten, produces lasting vocabulary with far less effort than cramming. Speaking early, even badly, helps more than waiting until one feels ready, since producing a sentence forces the learner to find words that listening alone does not. Few adults reach a native accent, but accent has little to do with being understood.","Motivation is the other ingredient. Adults who need the language for work, for a partner or for a new home keep going long after the novelty fades. Some researchers also report that speaking two languages may delay the symptoms of dementia, although later studies have disputed the size of the effect, and the claim should be treated with caution."],"groups":[{"k":"tf","items":[["Children who move abroad usually acquire the accent of their new home.","T"],["Adults learn more slowly than children at every stage of learning.","F"],["The ability to learn grammar begins to decline sharply at puberty.","F"],["Spaced repetition was invented by language teachers.","NG"],["Researchers agree that bilingualism clearly delays dementia.","F"]]},{"k":"mc","items":[["What does the writer say about adult learners in paragraph C?",["They lack the ability to learn quickly.","They usually have less exposure to the language.","They are more motivated than children.","They make less progress per hour of study."],"B"],["What is the writer's view of speaking early?",["It should wait until learners feel confident.","It helps learners find words they would not otherwise use.","It matters less than listening.","It improves accent more than anything else."],"B"],["The writer's attitude to the dementia claim is",["enthusiastic.","cautious.","scornful.","indifferent."],"B"]]},{"k":"cp","limit":"TWO WORDS","items":[["The idea that learning ability closes in childhood is called the ___ hypothesis.","critical period"],["Adults can use reading, grammar rules and strategies for memorising ___.","vocabulary"],["In ___, a word is reviewed just before it would be forgotten.","spaced repetition"],["Few adults reach a native ___.","accent"],["Adults who need the language for work keep going after the ___ fades.","novelty"]]}]},{"title":"The Shipping Container Revolution","paras":["Before 1956, loading a cargo ship was slow, skilled and dangerous. Goods arrived at the docks in sacks, crates and barrels, and teams of dockworkers lifted them into the hold one at a time. A ship could spend a week in port, and theft and breakage were common. Shipping a product halfway across the world cost so much that most manufacturers sold only close to home.","The change came from a trucking entrepreneur, Malcom McLean. Frustrated by lorries waiting at docks while goods were unloaded by hand, he proposed lifting the entire truck body onto the ship without opening it. In April 1956 a converted tanker carried 58 metal boxes from Newark to Houston. McLean later claimed that the cost of loading fell from about $5.86 per ton to 16 cents.","The idea needed a standard. Boxes of different sizes could not be stacked, and railways, ports and trucking firms each used their own. After years of argument, international standards fixed the dimensions in the late 1960s, and the 20-foot and 40-foot containers still in use today became the norm. Cranes, ships, trains and lorries around the world were then built to fit them.","Ports changed beyond recognition. A container ship can be unloaded in a day, which needs deep water, wide yards for stacking and good road and rail links, so older ports in city centres could not compete. Traffic moved to new terminals such as Felixstowe, Rotterdam and Singapore, while the London docks closed in the 1980s. Employment fell sharply, as one crane operator could do the work of dozens of dockworkers.","The effect on trade was larger than most economists predicted. When freight became cheap and reliable, companies began to spread production across several countries, making parts in one place and assembling them in another. Today most manufactured goods that cross oceans travel in containers, and the largest ships carry more than 20,000 of them.","The system has weaknesses. Because everything depends on a few giant ships and busy ports, a single problem can spread. In 2021 a container ship blocked the Suez Canal for six days and held up goods worth billions of dollars. Shortages of containers during the pandemic showed that the boxes themselves can run short when they pile up in the wrong country."],"groups":[{"k":"mi","items":[["A reference to the fall in employment at ports","D"],["An example of a disruption caused by a single vessel","F"],["A description of how goods were handled before containers","A"],["The reason a common size was needed","C"]]},{"k":"yn","items":[["High shipping costs before 1956 discouraged manufacturers from selling far from home.","Y"],["McLean's claim about loading costs has been independently verified.","NG"],["Older ports in city centres were unable to compete with deep-water terminals.","Y"],["Economists correctly predicted the effect of containers on trade.","N"],["Container shipping has made global trade more resilient than it was before.","N"]]},{"k":"sb","bank":["week","tanker","standard","production","warehouses","terminals","Suez Canal","month"],"text":"Before containers, goods were lifted into the hold by hand and a ship could spend a ___ in port. For containers to work, a common ___ was needed so that boxes could be stacked and moved between ships, trains and lorries. Deep water and wide yards mattered more than a central location, so traffic moved to new ___. Cheap freight allowed companies to spread ___ across several countries. In 2021, a single ship blocked the ___ for six days.","answers":["week","standard","terminals","production","Suez Canal"]}]}]},{"id":5,"diff":"Medium","passages":[{"title":"Lost Cities of the Amazon","paras":["For most of the twentieth century, textbooks described the Amazon basin as a wilderness that could not support large societies. Its soils were thin, the argument went, and farmers who cleared the forest soon exhausted the land. Any people living there must have been few and scattered.","Evidence against this picture accumulated slowly. Explorers' accounts from the sixteenth century spoke of large towns along the river, but later scholars dismissed them as exaggeration. Then archaeologists began to identify terra preta, dark and fertile soil full of charcoal and broken pottery. The soil was made by people, who added waste and burned material over generations, and it stays rich today, long after those people have gone.","The real change came from laser surveying. Lidar instruments carried by aircraft send down thousands of pulses a second, and the few that pass through gaps in the canopy bounce off the ground. A computer can strip away the trees and leave a model of the surface. In 2022 a survey of the Llanos de Mojos region in Bolivia revealed raised platforms, causeways and reservoirs built by a society known as the Casarabe culture, which flourished roughly between the years 500 and 1400.","In 2024, researchers reported even more from the Upano Valley in Ecuador, where lidar showed thousands of platforms, plazas and roads connected by straight paths. Dating suggests that people lived there some 2,500 years ago, which makes the settlements among the oldest known in the Amazon region.","Disease probably explains why so much was forgotten. After European contact, smallpox and other infections reached the interior ahead of the explorers themselves and killed a large share of the population. Fields went back to forest within a few generations, and by the time later travellers arrived, the cities were hidden under trees.","Researchers still disagree about how many people lived in the Amazon before contact. Estimates range from a few million to many times that, and the answer matters because it changes how we see the forest. Many ecologists now regard parts of it as a landscape that people shaped for thousands of years, though they stress that the evidence from each site cannot be applied to the whole basin."],"groups":[{"k":"hd","heads":["A once-dominant view of the rainforest","Soil and early accounts that challenged it","A new technique and what it found in Bolivia","Further discoveries in Ecuador","A possible reason for the disappearance of the settlements","Disagreement about numbers","The decline of the rubber industry","Methods for protecting ruins from looters"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Lidar can create a model of the ground beneath a forest canopy.","T"],["Terra preta is naturally formed by volcanic activity.","F"],["The Casarabe culture existed before the Upano Valley settlements.","F"],["The Amazon's population had recovered to its pre-contact level by the nineteenth century.","NG"]]},{"k":"sa","limit":"TWO WORDS","items":[["What do lidar instruments send down thousands of times a second?","pulses"],["What did the Bolivian survey reveal, besides platforms and causeways, that could store water?","reservoirs"],["In which Ecuadorian valley was the 2024 survey carried out?","Upano Valley"]]}]},{"title":"Vertical Farming","paras":["A vertical farm grows crops indoors in stacked layers, sometimes in a converted warehouse and sometimes in a purpose-built tower. Because plants are not tied to a field, a farm that covers the floor area of a single supermarket can hold dozens of growing levels.","Most vertical farms use hydroponics, in which the roots sit in a nutrient solution rather than in soil, and some use aeroponics, in which roots are misted. Both methods recycle water, and operators claim that they use up to 90 percent less than field farming. Light comes from LEDs tuned to the colours that plants use most, and computers adjust temperature, humidity and nutrients leaf by leaf.","Supporters list several advantages. Crops grow all year, whatever the weather outside, and sealed rooms keep out most insects, so pesticides are rarely needed. Farms can be built beside cities, which cuts the time and fuel needed to bring salad leaves to shops. Singapore, which imports most of its food, has set a target of producing 30 percent of its nutritional needs locally by 2030, and vertical farms are part of its plan.","The main problem is energy. Lighting an indoor farm costs far more than sunshine, which is free, and electricity is often the largest expense. This limits the range of crops. Leafy greens and herbs, which grow quickly and sell at high prices, make sense under LEDs. Staples such as wheat and rice, which need more light for longer, do not.","The business record is mixed. Several large companies have gone bankrupt in recent years, in part because costs rose faster than expected. Others have survived by growing a narrow range of high-value crops, or by locating farms where land is scarce and imports are expensive. Few analysts expect vertical farms to replace fields, but they may fill gaps that fields cannot."],"groups":[{"k":"mi","items":[["A reason why some crops are not suitable for indoor farms","D"],["A claim about how much water is saved","B"],["An example of a country that wants to produce more of its own food","C"],["A definition of hydroponics","B"],["A reference to firms that have failed","E"]]},{"k":"mc","items":[["According to paragraph C, pesticides are rarely needed because",["sealed rooms keep out most insects.","plants grow too quickly to be damaged.","LED light kills pests.","hydroponic roots repel insects."],"A"],["The largest expense for many vertical farms is",["rent for city land.","wages.","electricity.","water."],"C"],["Why are leafy greens suited to vertical farms?",["They need no nutrients.","They are resistant to disease.","They can grow without light.","They grow quickly and sell at high prices."],"D"],["What does the writer expect of vertical farms?",["They will replace conventional fields.","They will fill gaps that fields cannot.","They will disappear within a decade.","They will make wheat cheaper."],"B"]]},{"k":"cp","limit":"TWO WORDS","items":[["In hydroponics, the roots sit in a ___ rather than in soil.","nutrient solution"],["Light comes from ___ tuned to the colours that plants use most.","LEDs"],["Singapore has a target of producing ___ percent of its nutritional needs locally by 2030.","30"],["Some companies have survived by growing a narrow range of ___ crops.","high-value"]]}]},{"title":"Why We Procrastinate","paras":["Procrastination is often treated as a time-management problem, but researchers increasingly see it as a problem of managing feelings. When a task promises anxiety, boredom or self-doubt, putting it off brings immediate relief. The relief rewards the avoidance, which makes it more likely the next time.","Psychologists point out that the brain does not value rewards evenly across time. A benefit that is a month away feels smaller than the same benefit today, a tendency known as present bias. Writing a report promises a reward in the distant future, while checking messages offers a small one now, and the small one often wins.","The habit is common. Surveys suggest that about one adult in five is a chronic procrastinator, and among university students the proportion who put off work at least some of the time is far higher. Chronic delay has been linked with poorer health, partly because people postpone medical appointments, and with higher stress.","Deadlines help, but not equally. In an experiment at the Massachusetts Institute of Technology, students were set three papers. Those given evenly spaced deadlines by the instructor did best. Those who chose their own deadlines did better than those who had a single deadline at the end of the course, but worse than those with fixed deadlines. The result suggests that people know they need limits but do not always set the right ones.","Several techniques have support. Breaking a task into steps small enough to start in five minutes lowers the emotional cost of beginning. Planning in the form 'if it is nine o'clock, then I open the document' links an action to a cue, so that no decision is needed. A study of students who delayed before a first exam found that those who were encouraged to forgive themselves procrastinated less before the second one.","Willpower alone is a weak tool. People who change their surroundings, by turning off notifications or working in a library, usually do better than those who rely on resolve. Procrastination will not disappear, but it can be made less rewarding and less automatic."],"groups":[{"k":"yn","items":[["Procrastination is best explained as simple laziness.","N"],["Avoiding an unpleasant task can reward the person who avoids it.","Y"],["Present bias means people always choose smaller rewards over larger ones.","N"],["Chronic procrastination affects only university students.","N"],["Procrastinators tend to be less intelligent than other people.","NG"],["Changing one's surroundings is generally more effective than relying on willpower.","Y"]]},{"k":"m2","q":"Which TWO methods are described in paragraph E as ways to reduce procrastination?","opts":["dividing a task into small steps","working longer hours","making an if-then plan","avoiding all deadlines","working with a partner"],"ans":"AC"},{"k":"cp","limit":"TWO WORDS","items":[["A benefit that is a month away feels smaller than the same benefit today, a tendency known as ___.","present bias"],["About one adult in ___ is a chronic procrastinator.","five"],["In the MIT experiment, students were set ___ papers.","three"]]},{"k":"sa","limit":"TWO WORDS","items":[["What do people postpone because of chronic delay, harming their health?","medical appointments"],["What type of deadlines produced the best results?","evenly spaced"],["What can be turned off to reduce distraction?","notifications"]]}]}]},{"id":6,"diff":"Medium","passages":[{"title":"The Octopus Mind","paras":["An octopus has about 500 million neurons, roughly as many as a dog, but they are arranged in a way unlike that of any vertebrate. About two-thirds of them are in the arms, not in the central brain. Each arm can touch, taste and respond to its surroundings with a degree of independence, and an arm separated from the body will still react to stimuli for a short time.","Octopuses solve problems in ways that surprise researchers. In laboratory tests they unscrew jar lids to reach food, and in the wild some species have been seen carrying coconut shell halves across the seabed to use later as shelter. Captive animals learn quickly to tell apart keepers they like from those they do not, and some have been reported to squirt water at the ones they dislike.","This intelligence is puzzling because the animal's life is short and its social contact is limited. Many species live only one to two years, and mothers typically die soon after their eggs hatch, so young octopuses never learn from adults. Whatever they know, they must work out alone, which makes their ability to learn quickly more valuable.","Their bodies are equally unusual. An octopus has three hearts and blue blood that carries oxygen by means of copper rather than iron. It has no skeleton, so it can squeeze through any gap larger than its beak, the only hard part of its body, which is why captive animals are known for escaping from tanks.","Camouflage is the best-known talent. Cells in the skin called chromatophores expand and contract to change colour within a fraction of a second. Oddly, octopuses appear to be colour-blind, yet they match the colours around them closely, and some researchers think the skin itself may detect light and help the animal decide what to display.","Scientists have begun to ask what such an animal feels. In 2022, British law recognised octopuses, along with crabs and lobsters, as sentient beings, after a review concluded that there was strong evidence that they can feel pain. As a result, the way they are caught, farmed and killed has come under closer scrutiny."],"groups":[{"k":"mi","items":[["A comparison with the number of neurons in another animal","A"],["An explanation of why octopuses cannot learn from their parents","C"],["A description of how the animal's blood carries oxygen","D"],["A change in the law","F"],["A suggestion that the skin may detect light","E"]]},{"k":"tf","items":[["Most of an octopus's neurons are located in its central brain.","F"],["Some octopuses have been seen using coconut shells as shelter.","T"],["Octopuses can pass through any opening larger than their beak.","T"],["Octopuses are able to change colour more quickly than chameleons.","NG"]]},{"k":"cp","limit":"ONE WORD","items":[["An arm separated from the body will still react to ___ for a short time.","stimuli"],["Octopus blood carries oxygen by means of ___ rather than iron.","copper"],["Cells in the skin called ___ change colour within a fraction of a second.","chromatophores"],["In 2022, British law recognised octopuses as ___ beings.","sentient"]]}]},{"title":"Timber in Tall Buildings","paras":["For most of the twentieth century, tall buildings meant steel and concrete. Timber was used for houses and small blocks, and building codes in many countries limited how high it could go. That is changing because of a material called cross-laminated timber, or CLT, which is made by gluing layers of boards at right angles to one another.","Gluing the layers crosswise gives the panels strength in both directions and keeps them from warping. A CLT panel is much lighter than a concrete one of the same size, which means foundations can be smaller, and parts of a building can be made in a factory and assembled on site in days. The Mjøstårnet in Norway, completed in 2019, rises 85 metres and was for a time the tallest timber building in the world.","The main argument for timber is climate. Cement production alone accounts for roughly 8 percent of the world's carbon dioxide emissions, and steel is also energy-hungry. A tree takes in carbon dioxide as it grows, and that carbon remains stored in the wood for as long as the building stands. Supporters say a timber tower can therefore store carbon that a concrete tower would release.","Fire is the obvious worry, yet thick timber behaves in a predictable way. When a large panel burns, the outer layer chars, and the char insulates the wood beneath, so the panel keeps most of its strength for a measurable time. Fire tests have convinced regulators in several countries, and the 2021 version of the International Building Code, widely used in the United States, now allows timber buildings of up to eighteen storeys.","Critics raise other questions. Timber must be kept dry during construction, as water damage can affect both strength and appearance, and floors need extra layers to block noise. Whether the climate benefit is real depends on where the wood comes from: it counts only if forests are managed so that new trees replace those that were cut. The technology may also remain a niche, since most countries have too little certified forest to supply a building boom."],"groups":[{"k":"mc","items":[["What is the advantage of CLT panels being lighter than concrete ones?",["They need no factory work.","They can be glued together on site.","Foundations can be smaller.","They are cheaper per square metre."],"C"],["According to paragraph D, a thick timber panel in a fire",["forms a layer that protects the wood beneath.","burns faster than steel.","releases less smoke than concrete.","loses all strength after a few minutes."],"A"],["What condition does paragraph E attach to the climate benefit?",["Buildings must stay under eighteen storeys.","Timber must be imported from northern countries.","Panels must be recycled after use.","Forests must be managed so that trees are replaced."],"D"],["What does the writer suggest about the future of timber towers?",["They will soon replace steel.","They may stay a niche because forest supply is limited.","They will be banned in most countries.","They will become cheaper than concrete within a year."],"B"]]},{"k":"tf","items":[["CLT is made by gluing boards together in layers at right angles.","T"],["The Mjøstårnet remains the tallest timber building in the world.","F"],["Cement production accounts for about 8 percent of global carbon dioxide emissions.","T"],["Timber buildings cost less to insure than concrete ones.","NG"],["The 2021 International Building Code limits timber buildings to six storeys.","F"]]},{"k":"cp","limit":"ONE WORD","items":[["Parts of a CLT building can be made in a ___ and assembled on site.","factory"],["When a large panel burns, the outer layer ___ and insulates the wood beneath.","chars"],["Timber must be kept ___ during construction.","dry"],["Floors need extra layers to block ___.","noise"]]}]},{"title":"Public Libraries in the Digital Age","paras":["Predictions that the internet would make public libraries obsolete have not come true, but the institution has changed. In many countries, the number of books lent each year has fallen, and local councils under financial pressure have closed branches. Britain, for example, has lost several hundred libraries since 2010.","Yet libraries are used for much more than lending. For people without a computer at home, they provide free internet access, and staff help visitors fill in job applications and government forms that now exist only online. Many run language classes, homework clubs and sessions for children, and some serve as warm and safe places on cold days.","Some cities have built libraries to match. Helsinki's Oodi, which opened in 2018, has lending shelves on its top floor but devotes much of the building to other uses: a cinema, a recording studio, 3D printers and sewing machines that anyone can book. In its first year, visitors outnumbered the city's residents several times over.","Libraries have also begun to lend things other than books. Tool libraries let residents borrow drills and ladders, and some libraries offer seeds, musical instruments and even fishing rods. The idea is that households can share objects they need rarely, which saves money and space.","Digital lending brings its own difficulties. Publishers usually charge libraries several times the price a consumer would pay for an e-book, and many licences expire after a fixed number of loans or a fixed period, so a library may have to buy the same title again. Librarians argue that this is a poor use of public money, and publishers reply that unrestricted lending would damage sales.","Funding remains the central question. A library is hard to value because much of what it does, such as giving a child a quiet place to read, does not show up in a balance sheet. Supporters say councils should judge libraries by what they enable, not by how many books leave the building, but that argument is difficult to make when budgets are being cut."],"groups":[{"k":"hd","heads":["Why the future of libraries was questioned","Services beyond books","A building designed for new uses","Lending ordinary household items","A dispute over the cost of electronic books","The problem of measuring value","The history of the printing press","The growth of private bookshops"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["The internet has made public libraries unnecessary.","N"],["Library staff sometimes help people complete forms that are only available online.","Y"],["Publishers are right to limit the lending of e-books.","NG"],["It is difficult to put a financial value on everything a library does.","Y"]]},{"k":"sa","limit":"TWO WORDS","items":[["Which library opened in Helsinki in 2018?","Oodi"],["Besides ladders, what can residents borrow from tool libraries?","drills"],["What often happens to e-book licences after a fixed number of loans?","expire"],["What does a library give a child that does not show up in a balance sheet?","quiet place"]]}]}]},{"id":7,"diff":"Medium","passages":[{"title":"Glaciers and Sea Level","paras":["Glaciers and ice sheets cover about a tenth of the world's land and hold roughly two-thirds of its fresh water. Nearly all of that ice sits in two places, Antarctica and Greenland. The rest is spread among mountain glaciers in the Himalaya, the Andes, the Alps and Alaska, which are much smaller but are shrinking fastest.","Sea level rises for two reasons. When land ice melts, the water runs into the ocean and adds to its volume. Warm water also expands, so as the oceans absorb heat from the atmosphere they swell even without extra water. Since 1900 the global average sea level has risen by about 20 centimetres, and the rate has increased to more than 3 millimetres a year.","Not all ice matters equally. Sea ice, which floats, displaces almost exactly the water it will become when it melts, so its loss barely changes sea level, although it does change how much sunlight the Arctic absorbs. Ice that rests on land is different. The Greenland ice sheet holds enough water to raise the sea by about 7 metres, and Antarctica holds enough for about 58 metres.","Scientists worry most about West Antarctica. Many of its glaciers rest on bedrock that lies below sea level and slopes downward inland, so once warm water reaches the base, retreat can feed on itself. Thwaites Glacier, roughly the size of Florida, is the best known. Its ice alone would raise the sea by about 65 centimetres, and its collapse could pull neighbouring glaciers with it, raising the total to around three metres.","Mountain glaciers matter for a different reason. In the Andes and the Himalaya, meltwater feeds rivers that supply cities and farms through dry seasons. As glaciers shrink, flows at first increase, then pass a peak and decline. Several rivers in South America are thought to be past that peak already, and communities that depend on them are looking for other sources of water.","Satellites have made the measurements far better. Pairs of satellites in the GRACE mission measure tiny changes in gravity as they pass over ice sheets, and the changes show how much mass has been lost. The results confirm that both Greenland and Antarctica are losing ice, although the exact rate in Antarctica is still uncertain because of the continent's size and the difficulty of observing it."],"groups":[{"k":"tf","items":[["Almost all of the world's glacier ice is in Antarctica and Greenland.","T"],["Melting sea ice is a major cause of rising sea levels.","F"],["The expansion of warming seawater contributes to sea level rise.","T"],["Greenland would raise sea levels by more than Antarctica if its ice sheet melted.","F"],["Himalayan glaciers are shrinking more slowly than those in the Alps.","NG"]]},{"k":"mc","items":[["Why does the writer mention that sea ice floats?",["To show that its loss has little effect on sea level.","To explain why Arctic seas are cold.","To argue that it is melting fastest.","To show that it is heavier than land ice."],"A"],["What makes West Antarctica a particular concern?",["It has the thickest ice anywhere.","It is warmer than Greenland.","It has the most mountain glaciers.","Its glaciers rest on bedrock below sea level, so retreat can accelerate."],"D"],["According to paragraph E, river flow from shrinking glaciers",["falls immediately.","stays constant for decades.","increases at first, then declines.","increases permanently."],"C"],["What does the writer say about the GRACE satellites?",["They measure the height of the sea.","They detect changes in gravity that show how much ice mass has been lost.","They photograph glaciers at night.","They are no longer in use."],"B"]]},{"k":"cp","limit":"TWO WORDS","items":[["Glaciers and ice sheets hold roughly two-thirds of the world's ___.","fresh water"],["As the oceans absorb heat, the water ___ and sea level rises even without extra water.","expands"],["Thwaites Glacier is roughly the size of ___.","Florida"],["GRACE satellites measure tiny changes in ___.","gravity"]]}]},{"title":"The History of the Bicycle","paras":["The first machine that looked like a bicycle was built by Karl von Drais, a German official, in 1817. It had two wheels in line, a steerable front wheel and a wooden frame, but no pedals: the rider pushed along with his feet. One reason for its invention is thought to be a shortage of oats after a volcanic eruption in 1815, which ruined harvests and made keeping horses expensive.","Pedals arrived in the 1860s, when French makers attached them to the front wheel. The resulting velocipede had an iron frame and wooden wheels, and on cobbled roads it shook its rider so hard that it was nicknamed the boneshaker. To go faster, makers enlarged the front wheel, since one turn of the pedals then carried the machine further. By the 1870s the high-wheeler, later called the penny-farthing, had wheels as tall as 1.5 metres, and riders fell from them often and badly.","The design that survives was introduced in 1885 by John Kemp Starley in England. His Rover Safety Bicycle had two wheels of similar size and a chain that drove the rear wheel, so the rider sat low and could put a foot on the ground. Three years later, John Boyd Dunlop patented an air-filled tyre, which made the ride smoother and faster than solid rubber.","The 1890s brought a boom. Prices fell, and millions of people bought a bicycle for the first time. Women gained a way to travel alone, and fashion changed so that riders could wear shorter skirts and looser clothing. The American campaigner Susan B. Anthony said in 1896 that the bicycle had done more for women's freedom than anything else.","Cars later pushed bicycles off many roads. In the Netherlands, the turning point came in the 1970s, when protests followed the deaths of children in traffic, and the government began building separated cycle lanes. Today more than a quarter of trips in the country are made by bicycle, and sales of electric bicycles, which let riders climb hills and carry loads with less effort, are growing quickly across Europe."],"groups":[{"k":"mi","items":[["A possible reason why the first bicycle was invented","A"],["An explanation of why makers built very large front wheels","B"],["A description of two features that made the Safety Bicycle easier to ride","C"],["A reference to a protest that led to a change in government policy","E"]]},{"k":"yn","items":[["Von Drais's machine could be pedalled.","N"],["The velocipede offered a comfortable ride on cobbled streets.","N"],["Starley's design remains the basis of modern bicycles.","Y"],["Women were the main buyers of bicycles in the 1890s.","NG"],["Electric bicycles are growing in popularity in Europe.","Y"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["Pedals arrived in the ___, when French makers attached them to the front wheel.","1860s"],["On cobbled roads, the velocipede was nicknamed the ___.","boneshaker"],["John Boyd Dunlop patented an ___ tyre.","air-filled"],["Today more than a ___ of trips in the Netherlands are made by bicycle.","quarter"]]}]},{"title":"Gig Work and the Changing Economy","paras":["Gig work means paid tasks arranged through a digital platform: a car ride, a food
