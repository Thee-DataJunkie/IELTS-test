easurement gives a single random result.","a recent discovery.","a claim first made by Shor."],"B"],["Why is Grover's algorithm described as useful rather than revolutionary?",["It works only on small databases.","It cannot be run on real hardware.","It speeds up searches by only a quadratic factor.","It breaks encryption too slowly."],"C"],["What does the writer suggest about the 2019 Google result?",["It was proved false by IBM.","It used more qubits than any later machine.","It was repeated on a useful problem.","It showed an advantage only on a contrived task."],"D"],["Why does the writer mention that adversaries are storing encrypted data?",["To explain why quantum-resistant encryption is already being standardised.","To prove that quantum computers exist in secret.","To argue that encryption is no longer needed.","To criticise the standards body."],"A"]]},{"k":"tf","items":[["A qubit in superposition gives the same result every time it is measured.","F"],["Shor's algorithm was described in 1994.","T"],["Superconducting qubits operate at temperatures colder than outer space.","T"],["According to IBM, the 2019 task would take a supercomputer 10,000 years.","F"],["Quantum computers will make all classical computers obsolete.","NG"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["What is the process called in which the paths to wrong answers cancel out?","interference"],["What problem is caused when heat or vibrations disturb qubits?","decoherence"],["How many qubits did Google's 2019 processor have?","53"],["Which United States body published encryption standards in 2024?","NIST"],["What task becomes exponentially harder for classical computers as molecules grow?","Simulating molecules|simulating molecules"]]}]}]},{"id":15,"diff":"Hard","passages":[{"title":"Permafrost Thaw","paras":["Permafrost is ground that has stayed frozen for at least two years, and in much of the Arctic it has stayed frozen for thousands. It underlies about a quarter of the land in the Northern Hemisphere, in places to depths of several hundred metres. For most of that time, nobody paid it much attention; it was a feature of the landscape, not a risk.","That has changed because of what it contains. Over millennia, plants and animals died in these regions and, instead of rotting, were locked in ice. The frozen soils now hold an estimated 1,500 billion tonnes of carbon, nearly twice as much as the atmosphere. As the Arctic warms, which it has been doing nearly four times faster than the global average since 1979, microbes become active in thawed soil and break down this material, releasing carbon dioxide and methane.","Methane is the more worrying product. Over twenty years it traps heat about eighty times as effectively as carbon dioxide, although it breaks down in the atmosphere within about a decade, whereas carbon dioxide lingers for centuries. It is produced when soil thaws under water, as in the lakes that form when ice-rich ground collapses, because the absence of oxygen favours methane-producing microbes. Slow, gradual thaw, in contrast, tends to release mostly carbon dioxide.","Estimates of the total release vary widely. Some models project that by 2100 thawing permafrost could add carbon equal to the annual emissions of a large industrial country, others far more, depending on how much the world warms. The range reflects genuine uncertainty about abrupt thaw, which is hard to model because it can transform a landscape in a few years. The Batagaika crater in Siberia, a scar of collapsed ground, has grown to roughly a kilometre in length.","Thaw also threatens people directly. Roads, pipelines, airstrips and buildings in Arctic towns are built on ground that was assumed to be solid, and as it softens, structures tilt and crack. In 2020, a fuel tank at a power plant in Norilsk, Russia, collapsed and released about 21,000 tonnes of diesel into rivers; the operator blamed subsiding ground, though investigators emphasised other failings as well. Indigenous communities that hunt, herd and fish across thawing terrain report changes that traditional knowledge cannot always anticipate.","Frozen soil also preserves living things. In 2016, a herd of reindeer in northern Siberia was struck by anthrax after a summer of unusually high temperatures, and the outbreak was linked to a thawed carcass that had lain frozen for decades. Scientists have since revived viruses that were frozen for tens of thousands of years, though these infect only amoebas, and most researchers consider the danger to humans small compared with the climate effects."],"groups":[{"k":"tf","items":[["Permafrost underlies around a quarter of the land in the Northern Hemisphere.","T"],["Since 1979 the Arctic has warmed more slowly than the global average.","F"],["Methane stays in the atmosphere for longer than carbon dioxide does.","F"],["The operator and the investigators agreed that subsiding ground was the only cause of the Norilsk spill.","F"],["Reindeer herding has declined across Siberia since 2016.","NG"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["About how many billion tonnes of carbon do frozen soils hold?","1,500|1500"],["Besides methane, what gas do microbes release as thawed soil is broken down?","carbon dioxide"],["What is the name of the Siberian crater that has grown to about a kilometre in length?","Batagaika|Batagaika crater"],["In which Russian city did a fuel tank collapse in 2020?","Norilsk"]]},{"k":"mi","items":[["A reason why methane is produced in thawed lakes","C"],["An explanation of why estimates of release differ","D"],["A link between thaw and an outbreak of disease","F"],["A reference to damage to buildings and pipelines","E"]]}]},{"title":"Ancient Roman Concrete","paras":["Two thousand years ago, Roman builders made a material that has outlasted most of what has been built since. The dome of the Pantheon in Rome, completed in about 126 AD, spans 43 metres, and it remains the largest unreinforced concrete dome in the world. Harbours built by Roman engineers still stand in the Mediterranean, battered by waves for two millennia.","The recipe differs from that of modern concrete. Instead of Portland cement, which was patented in 1824, the Romans mixed lime with volcanic ash, called pozzolana in Italy, and with chunks of rock or brick. Vitruvius, the Roman writer on architecture, recommended ash from the area around Naples and described how it set even under water. The mixture was packed into wooden moulds and left to harden.","Engineers adapted the mix to the job. In the Pantheon dome, heavier volcanic rock was used low down, where loads were greatest, and lighter pumice and tuff higher up, so that the structure was thicker and denser at the base and thinner and lighter at the crown. The dome also contains hollow panels, called coffers, which reduce weight further without weakening the structure.","The harbours posed a puzzle. Seawater should degrade concrete, as it does today, yet Roman marine concrete becomes stronger. Researchers who drilled cores from ancient breakwaters found that seawater reacts slowly with the volcanic ash to form rare minerals, including one called aluminous tobermorite, which grow in cracks and bind the material together. The concrete was in effect still maturing, long after the builders had gone.","A second discovery, published in 2023, concerned the white lumps found throughout Roman concrete. These were long dismissed as signs of poor mixing. A team found that they are fragments of lime that stayed unreacted because the Romans appear to have mixed quicklime directly with the other materials at high temperature, instead of slaking it with water first. When a crack opens and water seeps in, the lumps dissolve and the calcium recrystallises, filling the gap. Samples in the laboratory healed cracks within weeks.","These findings have drawn attention because modern concrete has a short working life. Steel reinforcement, essential for many structures, rusts when moisture reaches it, and most reinforced concrete needs major repair or replacement within a century. Cement production also produces around 8 percent of the world's carbon dioxide. Even so, engineers are cautious. Roman concrete was weaker than modern concrete, hardened slowly and could not be reinforced with steel, so it cannot simply replace the modern material. The hope is that elements of the recipe can be adapted to make today's concrete last longer."],"groups":[{"k":"tf","items":[["The Pantheon dome is the largest unreinforced concrete dome in the world.","T"],["Portland cement was patented before the Pantheon was built.","F"],["Roman marine concrete weakened gradually in seawater.","F"],["Roman engineers recorded the recipe for the lime lumps in written manuals.","NG"]]},{"k":"mc","items":[["What does the writer say about the materials used in the Pantheon dome?",["Pumice was used at the base and basalt at the crown.","Heavier rock was used low down and lighter material higher up.","Only brick was used throughout.","The coffers were filled with lead."],"B"],["What do researchers think happens in Roman marine concrete?",["Seawater dissolves the lime completely.","Salt crystals replace the ash.","Minerals formed by seawater grow in cracks and bind the material.","Barnacles seal the surface."],"C"],["The white lumps in Roman concrete have been reinterpreted as",["a source of calcium that can repair cracks.","evidence of poor mixing.","decorative stones.","fragments of volcanic ash."],"A"],["The writer's conclusion about using Roman methods today is that they",["should replace modern concrete immediately.","are of purely historical interest.","cannot be studied scientifically.","may be adapted to help modern concrete last longer."],"D"]]},{"k":"sm","limit":"ONE WORD","text":"Roman builders mixed lime with volcanic ash and pieces of rock or brick, and Vitruvius recommended ash from near ___. In harbours, seawater reacts with the ash to form minerals such as aluminous ___, which strengthen the concrete over time. The white lumps are fragments of lime left unreacted because the Romans probably mixed ___ with the other ingredients. When water enters a crack, the lumps dissolve and the calcium ___, filling the gap. Modern concrete is limited because steel ___ when moisture reaches it.","answers":["Naples","tobermorite","quicklime","recrystallises","rusts"]}]},{"title":"The Gender Gap in Science Careers","paras":["Women make up about a third of the world's researchers, a share that has risen slowly over two decades but hides large differences between fields. In biology and medicine, women approach or exceed half of those entering the profession, while in physics, computer science and engineering they are a small minority. The difference suggests that the explanation cannot be a general lack of ability in science.","Numbers fall at each stage. Women are well represented among undergraduates in many countries, but fewer continue to doctorates, fewer still reach permanent posts, and the proportion in senior positions is lower again. This pattern, which researchers call the leaky pipeline, can reflect both women leaving and women being passed over, and the two are hard to separate in statistics.","Experiments have tried to isolate bias. In a widely cited study, scientists at American universities were sent the same application for a laboratory manager post, with the applicant named John in some copies and Jennifer in others. The male version was rated as more competent and was offered a higher starting salary. Later studies using different methods have sometimes found no bias or even a preference for women in hiring for academic posts, and the current view is that the effect depends on the field, the stage of career and how decisions are made.","Other research looks at beliefs about talent. A survey of academic fields found that those whose members thought success required innate brilliance, as opposed to hard work, had fewer women among their doctorates, and the same pattern held across the humanities as well as science. Experiments with children found that by the age of six, girls were already less likely than boys to say that members of their own sex are really, really smart, and were more cautious about games described as being for very clever children.","Family responsibilities play a part, but the picture is not simple. Academic careers demand mobility and long hours at the age when many people have children, and surveys show that mothers in science are more likely than fathers to reduce their hours or leave. Yet national differences complicate the story. In several countries, including Algeria and Oman, women outnumber men among graduates in some scientific subjects, which suggests that the barriers depend on the local culture and the career prospects that science offers women there.","One puzzling finding, reported in 2018, is that the gap in science degrees tends to be larger in the most gender-equal countries, such as Finland and Norway, than in less equal ones. The authors suggested that in wealthier, more equal societies, women have more freedom to choose subjects they enjoy, and that these tend not to be technical ones. Other researchers dispute the reasoning and the data, arguing that the choice is shaped by the same expectations about who belongs in the field. The debate remains unsettled, and most agree that no single cause is sufficient."],"groups":[{"k":"yn","items":[["Women are poorly represented in all scientific fields.","N"],["It is difficult to tell from statistics whether women leave science or are passed over.","Y"],["The laboratory manager study proves that bias explains the whole gender gap.","N"],["Beliefs about brilliance are more common in science than in the humanities.","NG"],["Girls at the age of six were already less likely than boys to associate being very smart with their own sex.","Y"],["The writer considers the question of the gender gap to be settled.","N"]]},{"k":"m2","q":"Which TWO factors does paragraph E identify as contributing to the gender gap?","opts":["academic careers demanding mobility and long hours","a lack of interest in science among girls","mothers more often reducing their hours or leaving","lower pay for women scientists","a shortage of laboratory space"],"ans":"AC"},{"k":"cp","limit":"ONE WORD","items":[["Researchers call the pattern of falling numbers at each stage the ___ pipeline.","leaky"],["In the experiment, the male applicant was offered a higher starting ___.","salary"],["In 2018 a study found that the gap in science degrees was larger in the most gender-equal ___.","countries"]]},{"k":"sa","limit":"THREE WORDS","items":[["About what proportion of the world's researchers are women?","a third|third"],["In which fields do women approach or exceed half of those entering?","biology and medicine"],["Which two countries are named as examples of the most gender-equal?","Finland and Norway|Norway and Finland"]]}]}]},{"id":16,"diff":"Hard","passages":[{"title":"Fungal Networks in Forests","paras":["Beneath a forest floor lies a second forest. Most land plants, perhaps nine in ten species, form partnerships with fungi that colonise their roots. The fungus extends thin threads, called hyphae, into the soil, and in return for sugars made by photosynthesis it delivers water and nutrients, especially phosphorus, that the plant could not easily reach alone. A teaspoon of healthy forest soil can contain several kilometres of these threads.","Two main types of partnership exist. In ectomycorrhizal associations, found on many trees of temperate and boreal forests such as pines and oaks, the fungus wraps the root tip in a sheath. In arbuscular associations, typical of most herbs, grasses and many tropical trees, the fungus penetrates the cells of the root. Both types can link several plants at once, since a single fungal individual may colonise the roots of many neighbours.","Popular interest began in 1997, when the ecologist Suzanne Simard reported that carbon labelled with a radioactive isotope had passed between birch and Douglas fir trees growing together, an exchange that she believed was carried through fungal links. The journal that published it called the connections the wood wide web, and later work, including Simard's own, suggested that older trees might feed seedlings, favour their own offspring and warn neighbours of insect attack.","These claims captured the public imagination, and they have also attracted criticism. A 2023 review of the evidence found that many statements in popular accounts were not well supported. Carbon does move between plants through fungi, but its quantity may be small, and it is unclear whether seedlings benefit from it in natural conditions. The idea that mother trees deliberately nurture their young rests on very few field studies, and defence signals, though shown in laboratory pots, have not been demonstrated in a forest.","Critics also dispute the language. Describing the network as a cooperative, even altruistic, system attributes intention to organisms that have none. A fungus is a business partner of a plant, and it gains the sugars that it needs to grow; it may move resources toward whichever host provides the most. Several researchers prefer to see the network as a trading system between species, not as a gift between relatives.","The debate matters for forestry. If fungal networks do support seedlings, then clear-cutting, which severs them, may slow regrowth, and leaving older trees standing would help a forest recover. Evidence from replanting experiments is mixed: in some, seedlings planted close to mature trees survived better, in others there was no difference. The cautious conclusion is that fungi are essential to forests, but the details of what they carry, and for whom, remain to be established."],"groups":[{"k":"yn","items":[["Most land plants form partnerships with fungi.","Y"],["Ectomycorrhizal fungi penetrate the cells of the root.","N"],["Simard's 1997 study proved that mother trees feed their offspring.","N"],["The writer believes the evidence for forest-scale defence signalling through fungi is strong.","N"],["Fungi are more important to tropical forests than to boreal forests.","NG"]]},{"k":"mc","items":[["What did the 2023 review conclude?",["All popular claims were confirmed.","Several popular statements lacked solid support.","Carbon never moves between plants through fungi.","Mother trees do not exist."],"B"],["Why do critics object to describing the network as cooperative?",["It underestimates the amount of carbon moved.","It ignores parasitic species.","It attributes intention to organisms that have none.","It overstates the size of the network."],"C"],["What do the replanting experiments show?",["Seedlings always do better near mature trees.","Clear-cutting speeds regrowth.","Fungi harm young seedlings.","Results vary between experiments."],"D"],["What is the writer's cautious conclusion?",["Fungi are essential to forests, but the details of what they carry remain uncertain.","Fungi are unimportant to forests.","Forestry should be abandoned.","Fungal networks do not exist."],"A"]]},{"k":"cp","limit":"ONE WORD","items":[["The thin fungal threads are called ___.","hyphae"],["In ectomycorrhizal associations the fungus wraps the root tip in a ___.","sheath"],["Simard's 1997 experiment used carbon labelled with a radioactive ___.","isotope"],["If fungal networks support seedlings, ___ may slow regrowth.","clear-cutting"]]}]},{"title":"Supply Chain Resilience","paras":["For forty years the aim of supply-chain management was efficiency. Firms using the just-in-time method pioneered by Toyota kept components in stock for hours rather than weeks, relying on suppliers to deliver exactly when needed. Costs fell, warehouses emptied and capital that had been tied up in inventory became available for other uses. The approach worked as long as nothing went wrong.","Several events showed what happens when something does. In 2011, floods in Thailand submerged factories that supplied a large share of the world's hard-disk drives, and computer makers faced shortages for months. In the same year, an earthquake and tsunami in Japan stopped production of specialised parts, including a pigment used in car paint, and car plants on other continents closed for weeks.","The pandemic made the problem general. A shortage of semiconductors, caused by a mixture of closed factories, shifts in demand and a fire at a chip plant, forced carmakers to cut production in 2021, and the industry's lost revenue was estimated at more than 200 billion dollars. Executives found that they often did not know which firms made the parts inside their products: they could name their direct suppliers, but not the suppliers of those suppliers.","Companies have responded in several ways. Some hold larger stocks of critical parts, a just-in-case approach that costs money but protects against interruptions. Others spread orders over several suppliers in different countries, so that one failure cannot halt production. Many have begun mapping their supply networks beyond the first tier, using shipping records and supplier surveys. A few have moved production closer to customers, a practice known as nearshoring.","Each remedy has a price. Larger inventories tie up money and need storage space. Using two suppliers instead of one forgoes the lower prices that come with large orders. Moving factories closer to home usually raises labour costs, and it can create new dependence on local suppliers who may be less efficient. Studies of firms hit by disruptions found that their share prices fell sharply and remained below trend for years, which is the argument that executives now use to justify spending.","Resilience is not the same as self-sufficiency. A country that tries to produce everything it needs would be poorer and, in some cases, no safer, since one national shock could then halt all production. Most economists therefore advise diversification rather than reshoring: a wide spread of suppliers across countries and regions, backed by good information. The ideal supply chain, on this view, is neither the leanest nor the shortest but the one that can reroute when a link fails."],"groups":[{"k":"hd","heads":["Why efficiency once dominated","Two disasters that exposed weaknesses","A wider crisis and a hidden problem","Ways in which firms have reacted","The costs of the remedies","Why diversity is preferred to isolation","The origins of container shipping","Government subsidies for car makers"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Toyota abandoned just-in-time methods after 2011.","NG"],["Many executives did not know who supplied their suppliers.","Y"],["A country that produces everything it needs is necessarily safer.","N"],["Using two suppliers instead of one always lowers costs.","N"]]},{"k":"cp","limit":"ONE WORD","items":[["Floods in Thailand submerged factories that supplied a large share of the world's ___ drives.","hard-disk"],["Moving production closer to customers is known as ___.","nearshoring"],["Most economists advise diversification rather than ___.","reshoring"]]}]},{"title":"Tidal Energy","paras":["The Moon's pull raises and lowers the sea twice a day, a rhythm so regular that tide tables are printed years in advance. That predictability is the main attraction of tidal power. Wind and solar output varies with the weather; tidal output can be calculated for any hour of any day, which makes it easier for grid operators to plan around.","The oldest approach is the barrage, a dam across an estuary with turbines in its gates. Water flows through as the tide rises and again as it falls. The Rance barrage in France, opened in 1966, still produces about 240 megawatts, and the Sihwa Lake plant in South Korea, completed in 2011, is slightly larger. Barrages work only where the difference between high and low tide is large, which restricts them to a few sites.","Barrages also change the places where they stand. By holding back water, they alter currents and trap sediment, and they can harm fish and the birds that feed on mudflats. Proposals for a barrage across the Severn estuary in Britain, which has one of the highest tidal ranges in the world, were repeatedly set aside on environmental grounds and cost. A smaller scheme for a tidal lagoon at Swansea Bay was rejected in 2018, when the government judged the electricity too expensive.","A newer approach avoids dams. Tidal stream turbines, which resemble underwater wind turbines, sit on the seabed or hang from floating platforms and spin in the current. They disturb the environment less, since water flows freely past them, and they can be installed in many more places. The first large array, MeyGen in the Pentland Firth off Scotland, began supplying electricity in 2016 with four turbines, and has since added more.","The difficulties are practical. Seawater is a harsh setting: it corrodes metal, and marine growth builds up on blades. Repairs must be made at sea, between tides and in rough weather, which makes them slow and costly. Turbines in strong currents also face enormous loads, and several early prototypes failed. As a result, the cost of electricity from tidal stream is still several times that of offshore wind, which has had far more investment.","Supporters argue that costs will fall as the technology is built in greater numbers, as happened with wind and solar. Others doubt that a technology with a limited number of good sites can reach the scale needed. The most likely outcome, according to many analysts, is a modest role in a few coastal regions where predictable power and strong currents coincide, supplying a few percent of national electricity at most."],"groups":[{"k":"yn","items":[["Tidal power output can be calculated in advance.","Y"],["Barrages can be built successfully at any coastal location.","N"],["The Swansea Bay lagoon scheme was rejected because of harm to birds.","N"],["Tidal stream turbines disturb the environment more than barrages do.","N"],["Tidal energy is cheaper than nuclear power.","NG"]]},{"k":"mi","items":[["A reason why barrages work only at certain sites","B"],["An example of a project rejected on grounds of cost","C"],["A description of a device that avoids the use of dams","D"],["A reference to damage caused by seawater","E"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["The Rance barrage in France opened in ___.","1966"],["Barrages can trap ___ and alter currents.","sediment"],["MeyGen is located in the Pentland ___ off Scotland.","Firth"],["Marine growth builds up on ___.","blades"],["Tidal stream power costs several times as much as ___ wind.","offshore"]]}]}]},{"id":17,"diff":"Hard","passages":[{"title":"How the Theory of Plate Tectonics Was Won","paras":["In 1912 the German meteorologist Alfred Wegener proposed that the continents had once been joined in a single landmass, which he later named Pangaea, and had drifted apart. His evidence was substantial. The coasts of South America and Africa fit together like pieces of a puzzle, identical fossils of a freshwater reptile, Mesosaurus, were found on both sides of the South Atlantic, and traces of ancient glaciers appeared in places that are now tropical.","Geologists rejected the idea, chiefly because Wegener could not explain how continents could move. He suggested that they ploughed through the ocean floor, driven by the Earth's rotation and by tidal forces, but physicists showed that these forces were far too weak. Most scientists preferred an alternative account in which land bridges once connected the continents and later sank. Wegener died in 1930 on an expedition to Greenland, still without support from the majority of his peers.","The breakthrough came from the sea. After the Second World War, navies used sonar to chart the ocean floor, and in the 1950s the American geologist Marie Tharp turned the data into maps that revealed a continuous mountain chain running down the middle of the Atlantic, with a deep valley along its crest. Her colleague Bruce Heezen at first dismissed her interpretation that this valley marked a place where the crust was splitting apart; he later accepted it.","In the early 1960s, Harry Hess proposed that new seafloor forms at these ridges as molten rock rises and cools, and then spreads outward, carrying the continents with it. Proof came from magnetism. Rocks that cool record the direction of the Earth's magnetic field at that time, and the field has reversed repeatedly. Surveys found stripes of alternating polarity on either side of the ridge, mirror images of each other, exactly as the theory predicted.","By the end of the decade these ideas had been brought together as plate tectonics. The Earth's outer shell is divided into about a dozen large plates that move slowly over the softer rock beneath. Most earthquakes and volcanoes occur along plate boundaries, and deep ocean trenches mark places where one plate is pushed under another. The theory explained patterns that had previously seemed unrelated, and it transformed geology in a way often compared with the effect of evolution on biology.","Wegener's central insight, that continents move, was vindicated, though not his mechanism. Plates are now thought to be moved mainly by the pull of dense, cold slabs sinking at subduction zones, along with the push at ridges. Satellite positioning allows direct measurement: plates move at a few centimetres a year, roughly the rate at which fingernails grow. The story is often told as a case of an outsider proved right, but historians note that acceptance depended on new evidence, not on any change in the quality of the argument."],"groups":[{"k":"tf","items":[["Wegener's evidence included fossils found on both sides of an ocean.","T"],["Physicists supported Wegener's explanation of how the continents moved.","F"],["Wegener died before his theory was widely accepted.","T"],["Marie Tharp's maps were produced from satellite data.","F"],["Harry Hess studied under Wegener.","NG"]]},{"k":"mi","items":[["A description of the stripes that confirmed seafloor spreading","D"],["The reason geologists preferred another explanation to Wegener's","B"],["A comparison between the effects of two scientific theories","E"],["A statement about how fast plates move","F"]]},{"k":"sm","limit":"TWO WORDS","text":"Wegener's idea was opposed because he could not explain the ___ of continental movement. Sonar surveys after the war revealed a ___ running through the middle of the Atlantic. Hess proposed that new seafloor forms at ridges and spreads outward, and magnetic ___ on either side of the ridge supported this. Plates are now thought to be moved mainly by cold slabs sinking at ___ zones.","answers":["mechanism","mountain chain","stripes","subduction"]}]},{"title":"Bilingual Brains","paras":["For most of the twentieth century, educators warned parents that raising a child in two languages would confuse them and delay their development. The warning rested on weak studies that failed to account for differences in family income and schooling. Later research has found no evidence that bilingualism slows normal development, and in much of the world, including Nigeria, where children commonly grow up with a home language, a regional language and English, it is simply the normal condition.","A key discovery about bilingual brains is that both languages are active at once. When a bilingual person hears a word, the brain briefly considers candidates in both languages, as eye-tracking studies show: a Russian-English speaker told to pick up a marker will glance at a stamp, because the Russian word for stamp sounds like marker. To speak in one language, the brain must therefore suppress the other, and it appears to do so continuously and with little conscious effort.","This constant selection led to a hypothesis: that practising it strengthens executive control, the set of mental skills that manage attention and conflict. Early experiments supported this. Bilingual children and adults responded faster than monolinguals in tasks that required them to ignore misleading cues, and brain scans showed differences in the regions that manage attention. Some studies also reported that bilingual people developed the symptoms of dementia four to five years later than monolinguals.","More recent work has been less supportive. Large studies with carefully matched participants often found no bilingual advantage in executive control, and an analysis of published studies suggested that positive results were more likely to be published than negative ones. The dementia findings have also been challenged on the ground that bilinguals in some samples came from different backgrounds, with different levels of education, which also affects the risk. Researchers who favour the advantage say that the tasks used are too crude to detect it.","What is better established are the effects on the brain's structure. In studies of people who learned a second language, areas of grey matter in the left parietal cortex were denser in bilinguals than in monolinguals, and the effect was larger in those who learned earlier and who spoke the second language more fluently. Such results show that learning a language changes the brain, though they do not show that those changes confer protection against any later decline.","The practical benefits are less in dispute. Bilingual children may have a smaller vocabulary in each language than monolingual peers, but their total vocabulary across both is similar or larger, and they usually learn a third language more easily. The social advantages are obvious: access to more people, texts and cultures. For parents, the sensible conclusion is that two languages carry no cognitive cost and may bring benefits whose size remains to be measured."],"groups":[{"k":"yn","items":[["Early warnings against raising children bilingually were based on sound evidence.","N"],["Bilinguals must suppress the language they are not using.","Y"],["A bilingual advantage in executive control has been conclusively proved.","N"],["Bilingualism can change the structure of the brain.","Y"],["Learning a third language is easier for monolingual speakers than for bilinguals.","N"]]},{"k":"mc","items":[["What did the eye-tracking studies show?",["Bilinguals avoid listening to one language.","Bilinguals look away while speaking.","Candidates from both languages are briefly activated.","Russian words are harder to hear than English ones."],"C"],["Why were positive results on the bilingual advantage criticised?",["They came only from children.","They contradicted brain scans.","They were reported by monolingual researchers.","Positive results were more likely than negative ones to be published."],"D"],["The writer's view of the grey matter findings is that they",["show that learning changes the brain but not that this protects against decline.","prove that bilinguals are protected from decline.","were obtained from a single child.","are of no scientific interest."],"A"],["The writer's advice to parents is that",["a second language should wait until school age.","two languages carry no cognitive cost and may bring benefits.","one language should be dropped when a child starts school.","bilingual homes need extra tutoring."],"B"]]},{"k":"cp","limit":"ONE WORD","items":[["A Russian-English speaker asked for a marker glances at a ___.","stamp"],["Executive control manages attention and ___.","conflict"],["Bilingual children may have a smaller ___ in each language.","vocabulary"],["The effect on grey matter was larger in those who learned ___.","earlier"]]}]},{"title":"The Circular Economy in Construction","paras":["Construction is among the largest producers of waste in the world. In the United Kingdom, buildings, excavation and demolition generate about 60 percent of all waste by weight, and the European Union puts its figure at more than a third. The standard pattern is linear: materials are extracted, made into a building, and, when the building is no longer wanted, demolished and sent to a landfill or crushed for low-grade use.","A circular economy aims to keep materials in use at their highest value for as long as possible. In construction this has three stages. Designers can reduce the quantity of material needed; they can plan buildings so that components can be reused; and when reuse is impossible, they can recycle materials into new products of similar quality. The Netherlands has set a target of a fully circular economy by 2050 and has applied it to public building contracts.","Design for disassembly is central. A conventional building is held together by welds, adhesives and poured concrete, which are almost impossible to separate without damage. A building designed for disassembly uses bolted connections and dry fixings, so that beams, panels and floors can be unscrewed at the end of the building's life and used again. Some developers now record every component in a digital material passport, a database that lists what the building contains and where it came from.","Recycling in practice often means downcycling. Most demolition concrete is crushed and used as a base for roads, a lower-value use than the original. It can replace part of the natural aggregate in new concrete, and standards in several countries allow this, but the proportion allowed in structural concrete is limited. Steel does better. It can be melted down repeatedly without loss of quality, although reusing beams without remelting saves still more energy.","Reuse faces obstacles. Taking a building apart carefully takes more labour than demolishing it, and in countries where labour is expensive this makes salvage uneconomic. New materials are cheap, since their price does not include the costs of extraction or disposal. Reclaimed items lack the test certificates that engineers and insurers expect, and no one wants to be liable for a component of uncertain history. Rules written for new products can exclude old ones even when they perform well.","Some places already have functioning markets for used materials. In many African and Asian cities, informal traders sell salvaged doors, windows, roofing sheets and timber, supplying builders who could not afford new ones. Formalising such markets, with grading and warranties, is one way to extend the practice in richer countries too. Supporters of the circular economy argue that the largest saving is achieved at the design stage, when decisions about what to build, and with what, determine all that follows."],"groups":[{"k":"hd","heads":["The scale of the waste problem","The principles behind the approach","Building so that parts can be separated","Why recycling often produces less valuable products","Practical and financial barriers to reuse","Existing markets and the importance of early decisions","The cost of land in cities","The decline of traditional building skills"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Buildings, excavation and demolition account for about 60 percent of waste by weight in the United Kingdom.","T"],["Welded connections make it easy to separate building components.","F"],["Steel loses quality each time it is melted down.","F"],["Reclaimed materials are always cheaper than new ones in the Netherlands.","NG"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["By what year does the Netherlands aim for a fully circular economy?","2050"],["What kind of database lists what a building contains and where it came from?","material passport"],["What is most demolition concrete used as a base for?","roads"],["What do reclaimed items lack that engineers and insurers expect?","test certificates"]]}]}]},{"id":18,"diff":"Hard","passages":[{"title":"The Antikythera Mechanism","paras":["In 1901, sponge divers sheltering from a storm near the Greek island of Antikythera found a Roman-era shipwreck at a depth of about 45 metres. Among statues, coins and pottery lay a corroded lump of bronze that, when it dried, broke apart into fragments with gears and inscriptions. For decades it was assumed to be a navigational instrument or an unusually elaborate clock.","Real progress came with modern imaging. In the early 2000s, researchers used X-ray tomography, a technique that builds a three-dimensional picture of the interior, to look inside the fragments without damaging them. They found at least thirty surviving gears with teeth cut by hand, packed into a wooden case about the size of a shoebox, as well as thousands of characters of text, some of which was a user's manual describing what the dials showed.","The machine was an astronomical calculator. Turning a hand crank moved pointers on the front dial to show the positions of the sun and moon against the zodiac. On the back, spiral dials tracked the cycles that govern the calendar: the Metonic cycle, which reflects that 19 solar years almost exactly equal 235 lunar months, and the Saros cycle of 223 months, which can be used to predict eclipses. A smaller dial counted the four-year cycle of the Olympic Games.","The mechanism accounts for the moon's uneven motion. The moon travels faster when nearer the earth, and the Greeks knew this. The maker reproduced the effect with a pair of gears, one of which carries a pin that slides in a slot on the other, so that the second gear speeds up and slows down as the first turns at a constant rate. No known device from the ancient world used this principle, and it appears again only in much later clockwork.","In 2021, a research team led by University College London published a reconstruction of the missing front, proposing that it displayed the five planets known in antiquity as well as the sun and moon. Because the surviving fragments cover only part of the device, the proposal is a model fitted to the gears and to inscriptions, not a copy of something that is known to have existed, and rival interpretations exist.","What the mechanism changes is our idea of ancient technology. Nothing of comparable complexity is known for around a thousand years afterward, until astronomical clocks appeared in medieval Europe. That it was found by chance suggests that other such instruments may have existed and been melted down for their metal, since bronze was valuable. Who made it remains unknown, though scholars have suggested links to workshops in Rhodes or Corinth, or to the tradition of the mathematician Archimedes, whose lost works described such devices."],"groups":[{"k":"mi","items":[["A reference to the depth at which the wreck lay","A"],["A description of the technique used to examine the fragments","B"],["An explanation of how the device modelled an irregularity in the moon's motion","D"],["A note of caution about a modern reconstruction","E"],["A suggestion that similar devices might once have been common","F"]]},{"k":"yn","items":[["The Antikythera fragments were immediately recognised as an astronomical device.","N"],["The Saros cycle can be used to predict eclipses.","Y"],["The 2021 reconstruction is a copy of an original that is known to have existed.","N"],["The mechanism was made by Archimedes.","N"]]},{"k":"cp","limit":"ONE WORD","items":[["Sponge divers found the wreck near the Greek island of ___ in 1901.","Antikythera"],["The gears were packed into a wooden case about the size of a ___.","shoebox"],["The Metonic cycle shows that 19 solar years almost equal 235 ___ months.","lunar"],["A smaller dial counted the four-year cycle of the ___ Games.","Olympic"]]}]},{"title":"Antibiotic Resistance","paras":["In 1945, accepting the Nobel Prize for the discovery of penicillin, Alexander Fleming warned that careless use could teach bacteria to resist it. The warning proved accurate. Within a few years of penicillin entering medicine, resistant strains of Staphylococcus had appeared in hospitals, and every new class of antibiotic since has met resistance, sometimes within a decade of its introduction.","Resistance arises through evolution. Within any large population of bacteria, a few individuals carry a mutation that lets them survive an antibiotic. When the drug kills the susceptible majority, those survivors multiply and take over. Bacteria can also acquire resistance directly from one another, passing genes in small rings of DNA called plasmids, even between species, which allows resistance to spread far faster than mutation alone could explain.","Overuse speeds the process. In many countries doctors prescribe antibiotics for viral infections such as colds, against which they have no effect, and patients often stop treatment when they feel better, leaving the toughest bacteria alive. In some places antibiotics can be bought without a prescription. On farms, large quantities are given to healthy livestock to promote growth or prevent disease, and in several countries animals consume more antibiotics than people.","The burden is already heavy. A 2022 study estimated that infections resistant to drugs were directly responsible for about 1.27 million deaths worldwide in 2019, and were associated with nearly five million. A widely quoted forecast of ten million deaths a year by 2050 has been criticised as resting on weak assumptions, but nobody disputes that the trend is upward. Surgery, cancer treatment and care for premature babies all depend on antibiotics to control infection.","New drugs have been slow to arrive. Antibiotics are taken for days, whereas drugs for chronic diseases are taken for years, so they earn less for the companies that develop them, and many large firms have left the field. Few genuinely new classes have been introduced since the 1980s. Researchers have recently begun to use machine learning to screen millions of molecules, and in 2023 one such system identified a compound that kills a dangerous hospital bacterium in laboratory tests, though it is far from reaching patients.","Policy responses address both supply and demand. Faster diagnostic tests would help doctors to avoid prescribing for viral infections, and vaccines reduce the need for antibiotics in the first place. Britain has trialled a subscription model in which the health service pays a fixed fee for access to a new antibiotic, whatever the volume used, so that the maker's income does not depend on sales. A neglected point is that in poorer countries, far more people die because they cannot obtain an effective antibiotic than because resistance has defeated it."],"groups":[{"k":"yn","items":[["Fleming predicted that bacteria could become resistant to penicillin.","Y"],["Resistance can spread between different species of bacteria.","Y"],["Antibiotics are effective against viral infections such as colds.","N"],["The forecast of ten million deaths a year by 2050 is universally accepted.","N"],["The subscription model should be adopted by all countries.","NG"]]},{"k":"mi","items":[["A reason why drug companies have lost interest in antibiotics","E"],["A description of how resistance genes pass between bacteria","B"],["A statement about the number of deaths linked to resistance","D"],["A reference to the use of antibiotics on livestock","C"]]},{"k":"sa","limit":"THREE WORDS","items":[["What are the small rings of DNA that carry resistance genes called?","plasmids"],["Which technology has recently been used to screen millions of molecules?","machine learning"],["What do faster diagnostic tests help doctors avoid prescribing antibiotics for?","viral infections"],["In poorer countries, more people die because they cannot obtain what?","effective antibiotic|an effective antibiotic"]]}]},{"title":"Urban Mobility and Congestion Pricing","paras":["A road is a shared resource that appears to be free, and that is why it is so often overcrowded. Each driver who enters a congested street slows everyone else, but pays none of the cost that this imposes. Economists have recommended since the 1920s that drivers should be charged for it, so that those with less urgent journeys choose another route, another time or another mode of transport.","The remedy most people expect, building more roads, tends to fail. In studies of American cities, the total distance driven has risen almost in proportion to the length of new road, because faster journeys attract more traffic, a pattern known as induced demand. Within a few years the new lanes fill and congestion returns to its former level. Adding capacity can relieve pressure for a time, but it does not remove the underlying imbalance between demand and supply.","Singapore introduced the first scheme in 1975, requiring drivers to buy a licence to enter the central area, and replaced it in 1998 with electronic gantries that charge according to the road and the time of day. London followed in 2003 with a flat daily charge for the centre. Traffic entering the zone fell by roughly a fifth, journey times improved, and bus services became faster and more reliable, though the benefits eroded in later years as delivery vans and ride-hailing vehicles increased.","Public opposition is usually strongest before a charge begins. In Stockholm, a majority was against the idea until a seven-month trial in 2006 showed that traffic fell by about 20 percent, air improved and bus passengers benefited. A referendum held after the trial approved the scheme, and support has remained high since. The experience suggests that people's views follow what they see, and that a visible improvement is more persuasive than any argument made in advance.","Fairness is the main objection. Critics argue that a charge is regressive, since a fixed fee takes a larger share of a poor driver's income. Defenders reply that in most cities drivers entering the centre are on average richer than the population, and that people on lower incomes are the heaviest users of buses and tend to gain when revenue is spent on them. The answer depends on the city and, above all, on what the money is used for.","Charging alone does not work where people have no alternative. Lagos introduced a dedicated bus lane system in 2008, the first in Africa, and soon carried a large number of passengers daily, though overcrowding and a shortage of vehicles remain. Planners argue that the best sequence is to improve public transport first and charge afterwards, so that those who stop driving have somewhere to go."],"groups":[{"k":"hd","heads":["A problem of shared costs and an economist's remedy","Why building more roads does not solve it","Early examples and their results","How a trial changed public opinion","A question about fairness","The importance of alternatives","The environmental effects of electric vehicles","The history of the motor car"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Drivers in congested streets pay the full cost of the delay they cause.","N"],["The benefits of London's charge continued unchanged for many years.","N"],["Public support for the Stockholm scheme rose after the trial.","Y"],["Charging should be introduced before public transport is improved.","N"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["A pattern in which faster journeys attract more traffic is known as ___ demand.","induced"],["Singapore introduced the first scheme in ___.","1975"],["Stockholm held a ___ after its seven-month trial.","referendum"],["Lagos introduced a dedicated bus lane system in ___.","2008"]]}]}]},{"id":19,"diff":"Hard","passages":[{"title":"Island Biogeography","paras":["Islands are easier to study than continents because they have clear edges. In the 1960s, the ecologists Robert MacArthur and Edward O. Wilson used this to ask a simple question: why does one island hold more species than another? Their answer, published in 1967 as the theory of island biogeography, became one of the most influential ideas in ecology.","Two patterns were already known. Large islands hold more species than small ones, with a tenfold increase in area roughly doubling the number of species, and islands close to a mainland hold more than remote ones. MacArthur and Wilson explained both with a balance. New species arrive by crossing the sea, at a rate that falls as the island fills up and as distance from the source increases. Existing species disappear through extinction, at a rate that rises as the island fills and is higher on small islands, where populations are small.","The number of species at which arrivals match extinctions is the equilibrium, and it is dynamic: the total remains stable while the particular species change. The prediction was tested by Daniel Simberloff, a student of Wilson, who had tiny mangrove islands in the Florida Keys fumigated to remove their insects and other arthropods. Within a year, the islands had been recolonised, and the number of species on each was close to what it had been before, although the species themselves were often different.","Natural experiments supported the theory. When the volcano Krakatau erupted in 1883, it destroyed life on the island. Within about a century, forest had returned and hundreds of species of plants, birds and insects had been recorded, carried by wind, water or wings. Islands nearer a source received more colonists, as the model predicted.","The theory acquired a second life in conservation. Forest fragments, nature reserves and mountain-tops are islands in a sea of farmland or cities, and they should lose species in the same way. In the Brazilian Amazon, the Biological Dynamics of Forest Fragments Project isolated plots of forest of 1, 10 and 100 hectares in the 1980s. The smallest plots lost species fastest, including large mammals and insect-eating birds, and the edges of all fragments changed in ways that islands in water do not.","That last point shows the limits of the theory. A habitat fragment is not as isolated as an oceanic island, because the surrounding farmland can be crossed by some species and used by others. The theory also ignores differences between species, treating a rare specialist as equal to a common generalist. Debates continued, particularly over whether one large reserve is better than several small ones of the same total area, and the answer depends on which species are the priority. Even so, the central finding that area matters is among the most consistently confirmed in ecology."],"groups":[{"k":"tf","items":[["MacArthur and Wilson published their theory in 1967.","T"],["A tenfold increase in island area roughly doubles the number of species.","T"],["Extinction rates are lower on small islands.","F"],["The Florida Keys experiment found that exactly the same species always returned.","F"],["The Biological Dynamics of Forest Fragments Project was funded by the Brazilian government.","NG"]]},{"k":"mc","items":[["What does the equilibrium represent?",["The point at which no more species can arrive.","A fixed list of species on an island.","The number of species at which arrivals match extinctions.","The largest number of species an island can hold."],"C"],["What was the result of the mangrove islands experiment?",["The islands stayed empty for many years.","The islands were recolonised with similar numbers of species, though often different ones.","Only insects returned.","Fumigation had no effect."],"B"],["Why should forest fragments lose species, according to the theory?",["They are islands in a sea of farmland or cities.","They are older than oceanic islands.","They are closer to cities than to forests.","They are colder."],"A"],["Which limitation of the theory is mentioned in paragraph F?",["It cannot account for the effects of area.","It was based on a single island.","It ignores extinction altogether.","It treats all species as equal and overstates the isolation of fragments."],"D"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["Which volcano's eruption in 1883 destroyed life on its island?","Krakatau"],["What type of tree grew on the Florida Keys islets used in the experiment?","mangrove"],["What area in hectares were the smallest forest plots in Brazil?","1"],["Which kind of animal, besides insect-eating birds, lost species fastest in the smallest plots?","large mammals"]]}]},{"title":"Sovereign Wealth Funds","paras":["A sovereign wealth fund is an investment pool owned by a government, usually created from the proceeds of natural resources or from foreign-exchange surpluses. The oldest, the Kuwait Investment Authority, was set up in 1953, when oil revenue began to exceed what the small state could spend. Today such funds together manage several trillion dollars, with a few of the largest each holding more than a trillion.","The case for them rests on two problems that resource-rich countries face. First, oil and mineral prices swing widely, and a government that spends every windfall has to cut services sharply when prices fall. A fund can absorb the surplus in good years and release it in bad ones. Second, resources run out. Turning a finite asset below ground into a financial asset that earns a return can allow later generations to share in the wealth.","Norway's fund, begun in 1996, is the largest. It owns shares in thousands of companies worldwide, together amounting to well over one percent of all listed shares. Its governing rule limits the government to spending no more than the expected real return on the fund, about 3 percent a year, which means that the capital itself is not drawn down. The rule has survived changes of government, and a main reason for its success is that it is easy to understand and hard to circumvent.","Funds can also go wrong. Some governments have used them to support favoured businesses or to cover budget deficits, and in Malaysia the state-owned fund 1MDB was found to have lost billions of dollars through fraud. Nigeria's experience is instructive. For years the Excess Crude Account, a savings arrangement, was drawn upon by states and the federal government in ways that left little in reserve. In 2011 the country created the Nigeria Sovereign Investment Authority, with separate funds for stabilisation, future generations and infrastructure, with the aim of protecting savings from short-term demands.","Questions of transparency and ethics arise too. In 2008, major funds agreed on a set of voluntary guidelines called the Santiago Principles, covering governance and disclosure, though compliance is checked only informally. Some funds apply ethical rules to their investments: Norway's has sold shares in companies that make certain weapons or that derive large revenues from coal. Others make no such commitments, and critics worry that funds from authoritarian states might use their investments to pursue political aims.","Countries receiving the investment have mixed feelings. Funds bring long-term capital and tend not to sell in a panic, which is a stabilising force in a crisis. On the other hand, governments have blocked purchases of ports, telecommunications firms or energy companies on security grounds when the buyer was owned by a foreign state. The rules vary, and they rarely distinguish clearly between funds that behave like ordinary investors and those that do not."],"groups":[{"k":"mf","title":"List of funds and documents","list":["The Kuwait Investment Authority","Norway's fund","1MDB","The Nigeria Sovereign Investment Authority","The Santiago Principles"],"items":[["was created in 1953 as the first fund of its kind","A"],["limits government spending to the expected real return","B"],["lost billions of dollars through fraud","C"],["has separate funds for stabilisation, future generations and infrastructure","D"],["are voluntary guidelines on governance and disclosure","E"]]},{"k":"yn","items":[["A fund can allow a government to avoid sharp cuts in services when resource prices fall.","Y"],["Norway's spending rule has been abandoned by successive governments.","N"],["Compliance with the Santiago Principles is enforced by law.","N"],["Funds owned by foreign states are always a security threat.","N"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["Norway's fund began in ___.","1996"],["The Excess Crude Account was a ___ arrangement.","savings"],["The Nigeria Sovereign Investment Authority was created in ___.","2011"],["Funds tend not to sell in a ___.","panic"]]}]},{"title":"The Psychology of Crowds","paras":["In 1895 the French physician Gustave Le Bon published The Crowd, which argued that people in large groups lose their capacity for reasoned thought. A crowd, he wrote, behaves like a single mind that is impulsive, emotional and easily led. The book influenced politicians and propagandists for decades, and the image it created of mobs as irrational remains common in news reports and everyday speech.","Modern researchers regard this picture as wrong in most respects. Studies of riots, protests and festivals, many of them based on video recordings and interviews, find that crowds are not mindless. Members often share an identity, such as supporters of the same team or participants in the same protest, and they act in ways that they regard as appropriate for that group. Violence, when it occurs, tends to be selective, aimed at targets that the group sees as legitimate, and it spreads when a group perceives that it is being treated unfairly.","The same idea explains why disasters in crowds are often misunderstood. In 1989, 97 people died at Hillsborough football stadium in England after fans were allowed into pens that were already full. Police and the press at first blamed drunken supporters, but a 2016 inquest found that the fans were not at fault and that the police had failed in their duty. Crowd crushes are caused by physics, not by hysteria: once the density passes about six people per square metre, individuals can no longer control their movement, and pressure from behind can be transmitted through the crowd.","Panic is also less common than is assumed. In studies of fires and evacuations, including the accounts of survivors of the 2001 attack on the World Trade Center, most people behaved calmly and helped one another, sometimes at risk to themselves. Evacuees often delay leaving, gathering belongings or checking on family, which is sensible from their point of view but can put them in danger. Designing exits and information on the basis of panic therefore misses the problem; better, planners say, to design for orderly behaviour and to tell people clearly what is happening.","Crowds can also be wise. In 1906 the statistician Francis Galton noticed that when about 800 visitors to a livestock fair guessed the weight of an ox, the middle guess was within one percent of the correct weight. Averaging works when the guesses are independent and errors are random. Experiments show that when people see each other's estimates, their answers converge and the accuracy of the crowd falls, because everyone is wrong in the same direction.","A final myth concerns bystanders. The view that people in groups do nothing when someone is in danger is widely taught, but analysis of security-camera footage from fights and assaults in three countries found that someone intervened in the large majority of cases, and that the more people present, the more likely it was that somebody would help. The crowd, on this evidence, is neither a monster nor an oracle. It is a group of people whose behaviour depends on what they know, what they share and how they are treated."],"groups":[{"k":"hd","heads":["A once-influential theory of the irrational mob","Evidence that crowds act with shared purpose","A disaster explained by physical conditions","Why panic is rarer than expected","When averaging many opinions works","Group size and helping behaviour","The design of sports stadiums","Crowds in ancient history"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Le Bon's picture of crowds is supported by modern research.","N"],["The 2016 inquest blamed the fans for the Hillsborough disaster.","N"],["People in fires and evacuations usually behave calmly.","Y"],["Crowds always make more accurate estimates than individuals.","N"]]},{"k":"cp","limit":"TWO WORDS","items":[["Crowd crushes become dangerous once the density passes about ___ people per square metre.","six"],["In 1906, Galton found that the middle guess for the weight of an ox was within ___ percent of the correct weight.","one"],["Evacuees often delay leaving to gather ___.","belongings"],["In the security-camera study, someone intervened in the ___ of cases.","large majority"]]}]}]},{"id":20,"diff":"Hard","passages":[{"title":"Satellites and Crop Monitoring","paras":["A farmer walking a field can judge the health of the crops in a few hours; a government responsible for millions of hectares has no such option. Satellites give an alternative. Since the launch of Landsat in 1972, instruments in orbit have recorded the surface of the Earth at regular intervals, and the archive now allows scientists to follow how any field has changed over fifty years.","The principle is simple. Healthy leaves absorb red light, which they use for photosynthesis, and reflect near-infrared light, which they do not need and which would heat them. A satellite sensor measures both, and the contrast between them can be reduced to a single number, the normalised difference vegetation index. A dense green crop scores high, a stressed crop lower, and bare soil lowest of all. Changes in the index over a season show when the crop emerged, how fast it grew and when it began to wilt.","Resolution has improved greatly. The first Landsat satellites could not distinguish features smaller than about 80 metres, which was adequate for large farms in North America but useless in places where a typical plot is less than a hectare. The European Sentinel-2 satellites, launched from 2015, see objects of 10 metres and pass over every location about every five days, so that even small fields can be monitored.","Clouds are a major obstacle, particularly in the tropics during the growing season, when skies are overcast for weeks. Radar satellites such as Sentinel-1 offer a solution, because their signals pass through cloud and are affected by the structure and moisture of crops. Combining optical and radar data, and feeding both into machine-learning systems trained on field observations, has made it possible to produce maps of which crops are planted where over whole countries.","Governments and agencies use the data in several ways. The Famine Early Warning Systems Network, established in 1985, uses satellite estimates of rainfall and vegetation to identify regions where harvests are likely to fail, so that food aid can be arranged before prices spike. Insurers have introduced index-based policies in Kenya and elsewhere, in which farmers receive a payment when satellite measurements show a drought, without any need for an assessor to visit the farm.","The technology has limits. Satellites measure light, not yield, and translating one into the other requires calibration with data collected on the ground, which is costly and scarce in the poorest regions. Models trained in one country may fail in another where crops, soils and farming methods differ. Access also matters: the farmers who stand to gain most often lack the phones or the connectivity to receive the information, and the gains tend to go first to large commercial operations."],"groups":[{"k":"hd","heads":["Why monitoring from orbit is valuable","The light-based principle behind vegetation measurement","Sharper images and smaller fields","Overcoming the problem of cloud cover","Uses by relief agencies and insurers","Obstacles to wider benefit","The history of space exploration","Pesticides and soil health"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Landsat has been recording the Earth's surface since 1972.","T"],["Healthy leaves reflect red light and absorb near-infrared light.","F"],["Radar signals are blocked by clouds.","F"],["Sentinel-2 images are free to download for all users.","NG"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["The first Landsat satellites could not distinguish features smaller than about ___ metres.","80"],["Sentinel-2 satellites pass over every location about every ___ days.","five"],["Satellite measurements must be calibrated with data collected on the ___.","ground"]]}]},{"title":"Negotiation: Anchors, Alternatives and Concessions","paras":["Most people think of a negotiation as a contest over a fixed amount, in which one side's gain is the other's loss. The best negotiators treat it as a problem with two parts: creating value and then dividing it. The first part is often overlooked, and a negotiator who skips it may end up arguing over a small pie when a larger one was available.","Preparation determines much of the result. The most useful single piece of preparation is knowing the best alternative to an agreement, which the authors of the book Getting to Yes called the BATNA. A seller with another buyer waiting has a strong BATNA and can reject a poor offer; one with no alternative has little power, whatever the personality of the other side. Alongside this, each party has a reservation price, the point beyond which it would walk away. If the two reservation prices overlap, a deal is possible within that zone.","Who speaks first matters more than most people believe. A first offer acts as an anchor, drawing the final price toward itself even when it is extreme. In a well-known study, experienced estate agents were asked to value a house after touring it and reading a brochure that included a listing price. Those shown a high price valued the house more highly than those shown a low price, although they insisted that the price had not influenced them.","A sensible response to an extreme anchor is not to counter with an extreme figure of one's own, which risks ending talks, but to reject it openly and restate the case with evidence. Negotiators who understand the market well resist anchors better, and so do those who have prepared a target figure in advance. Where the other side opens aggressively, it helps to shift attention from the number to the reasons behind it.","Concessions send signals. If a party gives up a lot at the start and less each round, the other side reads the shrinking steps as a sign that the limit is near. A party that concedes equally each time invites the other side to keep pushing. Because concessions are expected to be matched, a negotiator who gives something without asking for anything in return has usually conceded more than was necessary.","The most reliable way to create value is to trade issues of unequal importance. A buyer who cares most about delivery time and a seller who cares most about the price can both gain if the buyer pays slightly more and the seller delivers faster. This kind of exchange, called logrolling, depends on learning the other side's priorities, which takes questions and listening. International trade negotiations rely heavily on it: negotiators bundle many issues into a single package, so that each country can accept losses in some areas in return for gains in others."],"groups":[{"k":"mi","items":[["A definition of the best alternative available if talks fail","B"],["A description of an experiment involving property valuation","C"],["A warning about giving something away without asking for anything","E"],["A reference to the way international trade deals are structured","F"],["Advice on responding to an extreme opening position","D"]]},{"k":"yn","items":[["Negotiation is always a fixed contest in which one side's gain is the other's loss.","N"],["The estate agents in the study admitted that the listing price had influenced them.","N"],["Countering an extreme anchor with an extreme figure is the safest response.","N"],["Negotiators should never make the first offer.","NG"]]},{"k":"sa","limit":"THREE WORDS","items":[["Which book introduced the term BATNA?","Getting to Yes"],["What is the point beyond which a party would walk away called?","reservation price"],["What is the trade of issues of unequal importance called?","logrolling"],["What do shrinking concessions signal to the other side?","limit is near|the limit is near"]]}]},{"title":"Can Machines Be Conscious?","paras":["Few questions in philosophy are as hard to pin down as whether a machine could ever be conscious. The difficulty begins with the word. Consciousness here means subjective experience: the fact that there is something it is like to see red or feel pain. David Chalmers called the problem of explaining why physical processes in a brain give rise to such experience the hard problem, to distinguish it from the easier problems of explaining how the brain processes information.","The earliest test proposed for machine intelligence, by Alan Turing in 1950, avoided the question. Turing suggested that if a machine could converse so well that a judge could not distinguish it from a person, the question whether it truly thinks would lose its sense. John Searle disagreed. In his Chinese Room thought experiment of 1980, a person who knows no Chinese follows written rules to produce correct replies to Chinese questions. The room as a whole appears to understand Chinese, Searle argued, yet nothing in it does, so manipulating symbols cannot be enough for understanding.","Today's scientific theories of consciousness divide on whether a machine could qualify. Global workspace theory holds that consciousness arises when information is broadcast widely across a system, so that many processes can use it at the same time. This is a description of organisation, and in principle a machine could have it. Integrated information theory, in contrast, ties consciousness to the physical causal structure of a system. On that view, a conventional digital computer, whose circuits are largely separate, would have almost none, however sophisticated its software.","Large language models have sharpened the question. In 2022 a Google engineer claimed that a chatbot he had been testing was sentient, and he was dismissed after his claim was rejected by the company and by most experts. Such systems produce fluent statements about their feelings, but they are trained on human writing that is full of such statements, so their reports are poor evidence of anything. A system that has learnt to talk about consciousness is not thereby conscious, any more than a recording of a voice is a speaker.","In 2023 a group of philosophers and scientists tried a more systematic method. They drew up a list of indicator properties from several theories, such as a global workspace and a model of the system's own attention, and examined the leading AI systems against it. They concluded that none was a strong candidate for consciousness, but that no obvious technical obstacle prevents systems that satisfy more of the indicators from being built.","The practical stakes are real. If machines can have experiences, the way we treat them becomes a moral matter, and a failure to recognise suffering would be a serious wrong. If they cannot, then treating them as conscious wastes concern that is needed elsewhere, and may be exploited by companies that design systems to seem emotionally real. Because there is no agreed test, many researchers suggest caution in both directions: avoiding confident claims either that machines are conscious or that they cannot be."],"groups":[{"k":"yn","items":[["The hard problem concerns explaining why brain processes give rise to subjective experience.","Y"],["Turing believed that a machine passing his test would prove that it was conscious.","N"],["Searle argued that manipulating symbols is enough for understanding.","N"],["Fluent statements by chatbots about their feelings are strong evidence of consciousness.","N"],["Integrated information theory predicts that most digital computers could be conscious.","N"]]},{"k":"mc","items":[["According to paragraph C, global workspace theory",["ties consciousness to physical structure.","rules out machine consciousness.","depends on the hardware used.","describes an organisation that a machine could in principle have."],"D"],["Why does the writer say that chatbot statements about feelings are poor evidence?",["They are written by engineers.","They are always inaccurate.","The systems are trained on human text that contains many such statements.","They contradict each other."],"C"],["The 2023 group concluded that",["no current system is a strong candidate, but no obvious obstacle prevents future ones.","current systems are conscious.","AI can never be conscious.","global workspace theory has been disproved."],"A"],["The writer's closing suggestion is to",["treat every machine as conscious.","avoid confident claims in either direction.","ban chatbots.","wait for a perfect test before doing any research."],"B"]]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["Who named the hard problem?","David Chalmers|Chalmers"],["In which year did Searle propose the Chinese Room?","1980"],["Which theory ties consciousness to the physical causal structure of a system?","integrated information theory"],["In what year did a Google engineer claim that a chatbot was sentient?","2022"],["In what year did the group of philosophers and scientists publish its systematic list of indicators?","2023"]]}]}]}];

  function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); var m = Math.floor(s / 60); var r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }

  function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="dlg" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(m); return m; }

  function questionsHTML(pi) {

      h += '<section class="grp"><h3>Questions ' + a + (b > a ? ' to ' + b : '') + '</h3>';
