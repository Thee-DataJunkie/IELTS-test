delivery, a logo design or an hour of translation. Workers accept jobs one at a time, usually through an app, and are paid per task, not by the hour or by salary. The European Commission has estimated that about 28 million people in the European Union worked this way in 2022.","Its appeal is flexibility. A driver can switch on the app after a day job, a student can fit deliveries around lectures, and a parent can work during school hours. In countries with high youth unemployment, such as Nigeria and Kenya, platforms have become a significant source of income for people who have few other options.","The drawbacks are also well documented. Gig workers usually pay for their own vehicles, fuel and insurance, and receive no sick pay, holiday pay or pension. After costs, earnings per hour can fall below the legal minimum wage. Pay often depends on an algorithm that sets prices and allocates jobs without explanation, and a worker whose customer ratings drop can be removed from the platform with little warning.","Much of the argument is about legal status. Platforms generally class workers as independent contractors, which means they are not entitled to employment protections. Workers and unions say that people who must follow the platform's rules and cannot set their own prices are employees in everything but name. In 2021 the UK Supreme Court ruled that a group of Uber drivers counted as workers with rights to a minimum wage and paid holiday.","Governments have responded differently. California held a vote in 2020 that allowed ride-hailing companies to keep drivers as contractors in return for limited benefits. In 2024 the European Union adopted a directive that presumes platform workers to be employees when certain signs of control are present, leaving the platform to prove otherwise.","Whether gig work is a stepping stone or a trap probably depends on the person. Surveys suggest that most workers who rely on it for the majority of their income would prefer more security, while those who do it on the side tend to value the freedom. The question for policymakers is how to protect the first group without removing the flexibility that the second values."],"groups":[{"k":"hd","heads":["A definition and the scale of the phenomenon","The attractions for workers","Costs and risks borne by workers","A legal dispute about status","Different approaches by governments","Different groups of workers want different things","The decline of trade unions","Gig work in the nineteenth century"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Gig workers are usually paid by the hour.","N"],["A low customer rating can lead to a worker being removed from a platform.","Y"],["Platforms should be forced to classify all workers as employees.","NG"],["The UK Supreme Court decided that the Uber drivers in the case were independent contractors.","N"]]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["How many people in the European Union worked through platforms in 2022, according to the Commission?","28 million"],["Which two countries with high youth unemployment are named in the passage?","Nigeria and Kenya|Kenya and Nigeria"],["What would most workers who depend on gig work for their income prefer to have more of?","security"],["In what year did California hold its vote on ride-hailing drivers?","2020"]]}]}]},{"id":8,"diff":"Medium","passages":[{"title":"Desert Locusts","paras":["The desert locust is an unremarkable insect for most of the time. It lives alone in dry regions from West Africa to India, feeds on sparse plants and avoids other locusts. Then the rains come.","Rain brings green growth, and green growth brings breeding. As numbers rise and food shrinks again, locusts are crowded into the few patches of plants that remain. Contact with each other, particularly on their hind legs, releases serotonin in the nervous system, which changes their behaviour within hours. They stop avoiding one another, become attracted to the group, and over several generations change colour from green to yellow and black.","A swarm can contain 40 to 80 million locusts in every square kilometre and may cover hundreds of square kilometres. Each insect eats about its own weight in fresh food every day, roughly two grams, so a swarm of one square kilometre eats as much in a day as 35,000 people. Carried by wind, a swarm can travel 100 to 150 kilometres in a day.","From 2019 to 2021, a series of swarms spread through East Africa, the worst outbreak in Kenya for seventy years and in Ethiopia and Somalia for twenty-five years. The cause was a run of unusually heavy cyclones that dumped rain on the empty deserts of the Arabian Peninsula, where locusts bred for months without being noticed.","Control depends on early action. The FAO monitors vegetation by satellite and collects reports from ground teams, hoping to find young locusts before they form swarms. Once swarms take flight, aircraft spray them with pesticides, which is costly and harms other insects. Researchers are testing a fungus that infects locusts, though it works more slowly. Surveys are difficult in places affected by conflict, such as Yemen, and that is where outbreaks can grow unseen."],"groups":[{"k":"tf","items":[["Desert locusts normally live alone.","T"],["Crowding changes locust behaviour only after several generations.","F"],["A swarm of one square kilometre eats as much in a day as 35,000 people.","T"],["The 2019 to 2021 outbreak began in Kenya.","F"],["Locust swarms have never been recorded in Europe.","NG"]]},{"k":"sa","limit":"TWO WORDS","items":[["What chemical is released in the nervous system when locusts touch each other's hind legs?","serotonin"],["About how much fresh food does each locust eat per day?","two grams|2 grams"],["Which organisation monitors vegetation by satellite?","FAO"],["What kind of weather events brought rain to the Arabian Peninsula before the outbreak?","cyclones"]]},{"k":"mi","items":[["An explanation of why aircraft spraying has drawbacks","E"],["The way in which crowding alters behaviour","B"],["A comparison between swarm consumption and human food needs","C"],["A reference to the weather conditions behind a recent outbreak","D"]]}]},{"title":"Colour in Packaging and Purchasing","paras":["Walk down a supermarket aisle and the packaging does much of the selling. Designers know that colour is processed faster than text or shape, so it is often the first thing a shopper registers. A widely quoted claim says that people form a judgement of a product within 90 seconds and that up to 90 percent of that judgement is based on colour alone. The figure appears in countless marketing articles, but nobody has produced the original study.","What research does support is a modest, consistent link between colour and expectation. Blue is associated with trust and calm, which is why banks and technology firms use it often, while green suggests health or nature and appears on organic products. Red and yellow are common in fast-food restaurants, where they are thought to suggest energy and encourage quick decisions, though the evidence for this is thinner than the confidence of the advice.","Colour can even affect how food tastes. In one experiment, volunteers drank the same hot chocolate from cups of different colours. Those who drank from an orange or cream-coloured cup rated it as tastier than those who used a white or red cup. The drink was identical; only the expectation had changed.","Meanings are not universal. Red suggests danger in much of Europe but good luck in China, where it is used at weddings. White is worn at weddings in many Western countries but is associated with mourning in parts of East Asia. A company that sells abroad therefore cannot assume that its home palette will carry the same message.","Because colour can identify a brand, firms protect their choices. Several companies have tried to register a single colour as a trademark, with mixed success, since courts are reluctant to let one business own a colour outright. The most reliable advice from researchers is modest: choose a colour that fits what the product is, and make sure it stands out from competitors' packaging on the shelf."],"groups":[{"k":"yn","items":[["Shoppers process colour more slowly than text.","N"],["The claim that 90 percent of judgements are based on colour is supported by a known study.","N"],["Red and yellow have been proved to speed up customers' decisions in fast-food restaurants.","N"],["The meaning of a colour can differ between cultures.","Y"],["Large companies should avoid using blue in their branding.","NG"]]},{"k":"mc","items":[["What does the writer say about the 90-second claim?",["It was disproved by a later study.","Its original source has not been found.","It applies only to food.","It was first made by designers."],"B"],["What did the hot chocolate experiment show?",["The cup colour changed the temperature of the drink.","White cups improved the aroma.","Some cup colours led people to rate the drink as tastier.","The contents of the drink differed by cup."],"C"],["The writer mentions red and white in paragraph D to show that",["those colours should be avoided.","weddings are celebrated differently around the world.","Western companies dominate global branding.","colours can carry different meanings in different places."],"D"],["The writer's advice on colour in paragraph E is to",["copy competitors' packaging.","trademark every colour a company uses.","choose a colour that suits the product and stands out.","avoid bright colours."],"C"]]},{"k":"sa","limit":"THREE WORDS","items":[["Which colour is associated with trust and calm?","blue"],["In which country is red used at weddings?","China"],["What does green suggest, according to the writer?","health or nature|health|nature"],["What are courts reluctant to let one business own outright?","colour|a colour"]]}]},{"title":"Hydropower in Africa","paras":["Africa has some of the world's greatest hydropower potential, much of it in rivers that run fast through steep valleys in the centre and east of the continent. Yet only a small fraction of that potential has been developed, and about 600 million Africans still lack access to electricity.","The first great projects were built in the colonial and early independence eras. The Kariba Dam, on the Zambezi between Zambia and Zimbabwe, was completed in 1959 and created one of the largest artificial lakes in the world. Its construction forced about 57,000 Tonga people from their homes. In Egypt, the Aswan High Dam, finished in 1970, ended the annual flooding of the Nile and allowed farmers to grow more than one crop a year, but it also trapped the silt that once fertilised the delta, and it displaced around 100,000 Nubians.","The most ambitious plan is on the Congo River, which carries more water than any river except the Amazon. A scheme at Inga could, in its largest form, generate around 40,000 megawatts, nearly double the capacity of the Three Gorges Dam in China. Inga has been discussed since the 1970s, and two smaller dams built there still operate below their capacity, while the larger phases remain unbuilt because of cost and disagreements over who would buy the power.","Ethiopia's Grand Renaissance Dam on the Blue Nile began generating electricity in 2022 and is the largest hydropower project in Africa. It also provoked a dispute with Egypt and Sudan, which depend on the Nile downstream and feared that a fast filling of the reservoir would reduce their water supply. Talks have been held for years without a binding agreement.","Climate is a risk for the whole industry. Hydropower depends on predictable flow, and droughts have cut output sharply. In 2015 and 2016, and again in 2019, low water at Kariba forced Zambia and Zimbabwe to ration electricity for many hours a day.","Because of these risks and the damage large dams cause, some governments and funders now favour smaller schemes. Run-of-river plants, which divert part of a stream through turbines without a large reservoir, displace fewer people and can supply a district or a mini-grid. They cannot match the output of a giant dam, but they can be built faster and cost less."],"groups":[{"k":"mf","title":"List of projects and schemes","list":["The Kariba Dam","The Aswan High Dam","The Inga scheme","The Grand Renaissance Dam","Run-of-river plants"],"items":[["was completed in 1959 and forced about 57,000 Tonga people to move","A"],["ended the annual flooding of the Nile","B"],["could in its largest form generate around 40,000 megawatts","C"],["caused a dispute with Egypt and Sudan over water supply","D"],["displace fewer people because they need no large reservoir","E"]]},{"k":"tf","items":[["About 600 million Africans lack access to electricity.","T"],["The Aswan High Dam increased the amount of silt reaching the Nile delta.","F"],["The two dams already built at Inga operate at full capacity.","F"],["Output at Kariba has recovered fully since 2019.","NG"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["The Kariba Dam lies on the ___ between Zambia and Zimbabwe.","Zambezi"],["The Congo River carries more water than any river except the ___.","Amazon"],["Egypt's Aswan High Dam was finished in ___.","1970"],["Hydropower depends on predictable ___.","flow"],["Run-of-river plants divert part of a stream through turbines without a large ___.","reservoir"]]}]}]},{"id":9,"diff":"Medium","passages":[{"title":"The Printing Press","paras":["Before the fifteenth century, every book in Europe was copied by hand. A skilled scribe might need several months to produce a single Bible, so books were rare, expensive and mostly kept in monasteries and universities. Errors crept in with each copy.","Printing with movable type was not invented in Europe. Block printing was used in China by the ninth century, and a ceramic movable type was devised there around 1040. In Korea, a book printed with metal type in 1377 is the oldest surviving example. Chinese, with its thousands of characters, gained less from movable type than alphabetic languages did, since a printer needed vast stocks of type.","Around 1450, Johannes Gutenberg, a goldsmith in Mainz, combined several existing ideas into a working system. He cast letters in an alloy of lead, tin and antimony that was hard enough to survive repeated use, developed an oil-based ink that stuck to metal, and adapted a screw press of the kind used for wine. His Bible, completed in about 1455, is thought to have run to around 180 copies.","The technology spread fast. By 1500, printing shops operated in more than 200 towns, and some 20 million books had been printed. Prices fell sharply, and for the first time a middle-class family could own more than a prayer book. Authors could reach readers in other countries without crossing the border themselves, and a pamphlet published in one city could be reprinted in another within weeks.","Authorities responded in different ways. Martin Luther's writings, printed from 1517, spread through Germany with a speed that his opponents could not match, and the Catholic Church later issued a list of prohibited books. Printing also standardised spelling and gave scientists a means of sharing exact illustrations and tables, so that errors could be spotted and corrected across Europe."],"groups":[{"k":"hd","heads":["Books before mechanical reproduction","Earlier printing in East Asia","The combination of techniques in Mainz","Rapid growth and falling prices","Reactions and wider consequences","The invention of paper","Gutenberg's financial troubles"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5]]},{"k":"tf","items":[["Movable type was first invented in Europe.","F"],["A book printed in Korea in 1377 used metal type.","T"],["Gutenberg developed an ink based on oil.","T"],["Gutenberg's Bible was printed in more than 500 copies.","F"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["A scribe might need several months to produce a single ___.","Bible"],["Gutenberg cast letters in an alloy of lead, tin and ___.","antimony"],["By 1500, printing shops operated in more than ___ towns.","200"],["The Catholic Church later issued a list of ___ books.","prohibited"]]}]},{"title":"Why Birds Migrate","paras":["Every autumn, billions of birds leave their breeding grounds and fly to warmer regions, returning in spring. The champion is the Arctic tern, which breeds near the Arctic and winters near the Antarctic, a round trip of about 70,000 kilometres. A bar-tailed godwit has been tracked flying from Alaska to New Zealand without stopping, a journey of around 11,000 kilometres that took eleven days.","Migration is thought to have evolved as a way of following food. In northern summers, insects are plentiful and daylight lasts long enough for parents to feed their chicks for many hours. In winter the insects disappear, and birds that stayed would starve. Moving south costs energy and carries risk, but for many species the gain in survival outweighs it.","Finding the way is a remarkable feat, particularly for young birds that make their first journey alone. Birds use the sun and the pattern of stars, and they appear to sense the Earth's magnetic field through light-sensitive proteins in the eye. Experiments in which researchers shifted the magnetic field around caged birds showed that the animals changed the direction they tried to fly. Older birds also learn landmarks, such as coastlines and rivers.","Migration routes are not fixed. Since the 1960s, some blackcaps from central Europe have started wintering in Britain instead of Spain, a shift that has occurred in only a few decades. It seems to have been driven by a genetic change that sends some birds west rather than south, together with food put out by householders in British gardens.","Many migrants are now in decline. Stopover sites, where birds rest and feed, are being lost: the mudflats of the Yellow Sea, vital for shorebirds, have shrunk by about two-thirds as a result of land reclamation. Warmer springs mean that insects may peak before the birds arrive, so chicks hatch after the food is gone. Tiny tracking tags, some weighing less than a gram, now let researchers follow individual birds and find where they are most at risk."],"groups":[{"k":"tf","items":[["The Arctic tern breeds near the Arctic and winters near the Antarctic.","T"],["The bar-tailed godwit stopped to rest during its flight from Alaska to New Zealand.","F"],["Migration is mainly a response to a shortage of water.","F"],["Migrating birds use only the sun to navigate.","F"],["Blackcaps in Britain are a different species from blackcaps in Spain.","NG"]]},{"k":"mc","items":[["Why do northern summers favour breeding birds?",["There are fewer predators.","Insects are plentiful and the days are long.","Temperatures never fall below freezing.","Nests are easier to build."],"B"],["What did the experiment with magnetic fields show?",["Birds changed the direction they tried to fly when the field was shifted.","Caged birds ignored the field.","Magnetic fields harm young birds.","Only older birds use the field."],"A"],["According to paragraph E, why might chicks go hungry in warm springs?",["Parents lay fewer eggs.","Tracking tags make flight harder.","The insect peak comes before the birds do.","Mudflats are flooded."],"C"]]},{"k":"sa","limit":"THREE WORDS","items":[["What kind of proteins in the eye may allow birds to sense the magnetic field?","light-sensitive proteins"],["In which country do some blackcaps now winter instead of Spain?","Britain"],["What do householders put out that may help blackcaps in Britain?","food"],["Which sea has lost about two-thirds of its mudflats?","Yellow Sea"],["What do the smallest tracking tags weigh less than?","a gram"]]}]},{"title":"Smart Meters and Household Energy","paras":["A conventional meter records a total, and someone has to read it. A smart meter records use at short intervals, often every half hour, and sends the figures automatically to the supplier. Households stop receiving estimated bills, and suppliers no longer need staff to visit homes.","The meter is paired with a small display that shows the cost of electricity as it is used. Evaluations in several countries have found that households with such displays cut consumption by about 2 to 4 percent, mainly by switching off equipment that was left running. The saving is modest, but it comes at no cost to comfort.","A larger benefit is to the grid. Demand for electricity peaks in the early evening, and power stations that run only at those times are expensive and often polluting. Suppliers can offer cheaper rates at off-peak hours, which only smart meters can charge for, and customers who shift their washing or the charging of an electric car to the night help to flatten the peak. The same data helps grid operators balance supply from wind and solar, which varies with the weather.","Privacy is the main objection. Half-hourly readings can show when a family wakes up, when they are away and, with analysis, which appliances they own. Regulators in Europe treat the data as personal information, so suppliers must ask for consent before using it for anything beyond billing. Campaigners say these protections are untested.","Rollout has been uneven. In Britain, many early meters lost their smart functions when customers switched supplier, and replacing them added to the cost. Official reviews have found no evidence that the radio signals meters use pose a health risk, but the claim persists online and has slowed acceptance in some areas.","Whether smart meters repay their cost remains debated. Critics point out that the savings for households are small and that the largest gains go to suppliers and the grid. Supporters answer that the real value will appear later, as more homes use heat pumps, solar panels and electric cars, which make the timing of demand more important."],"groups":[{"k":"mi","items":[["A description of how a smart meter differs from a conventional one","A"],["The reason peak demand is costly","C"],["An explanation of why consent is needed for some uses of data","D"],["A claim that online worries have slowed acceptance","E"]]},{"k":"tf","items":[["Smart meters remove the need for estimated bills.","T"],["Households with displays reduce their consumption by about 2 to 4 percent.","T"],["Smart meters make homes less comfortable.","F"],["European regulators treat smart meter data as personal information.","T"],["Early British meters were replaced free of charge.","NG"]]},{"k":"sm","limit":"TWO WORDS","text":"A smart meter records use every ___ and sends the figures to the supplier. Cheaper rates at ___ hours encourage people to move demand, which helps the grid cope with the evening ___ and balance supply from wind and solar. Privacy campaigners worry that detailed data reveals which ___ a family owns, while official reviews found no evidence that radio signals pose a ___ risk.","answers":["half hour","off-peak","peak","appliances","health"]}]}]},{"id":10,"diff":"Medium","passages":[{"title":"Salt: A History","paras":["Humans cannot live without salt, and for most of history getting it was difficult. Before refrigeration, it was also the best way to preserve meat and fish, so societies with salt could store food through winter and travel with provisions. Salt shaped where people settled. The Austrian town of Hallstatt has been a salt-mining centre for several thousand years.","States soon learned to control it. Roman roads such as the Via Salaria carried salt to the capital, and some historians think the word salary comes from the allowance that soldiers received for buying it, although the link is disputed. In France, the gabelle, a tax on salt, was levied from the fourteenth century until the Revolution. It was so heavily resented that it became a cause of rebellion, and it was abolished in 1790.","In West Africa, salt moved along caravan routes across the Sahara. Salt from desert mines such as Taghaza was carried by camel to Timbuktu and exchanged for gold, since the forest regions to the south had gold but little salt. A caravan could include hundreds of camels, each loaded with heavy slabs.","Salt could also be a symbol of resistance. In 1930, Mahatma Gandhi led a march of about 385 kilometres to the coast at Dandi to protest against British laws that forbade Indians to make their own salt. When he scooped up natural salt from the shore, it became the signal for protest across the country, and tens of thousands of people were arrested.","Today salt is cheap, and most of it is not eaten. Only about 6 percent of the world's supply goes into food; the rest is used by chemical industries and to melt ice on roads. The main health concern is now too much salt, which raises blood pressure, and many governments have asked food makers to cut the amount they add."],"groups":[{"k":"tf","items":[["Salt was used to preserve meat and fish.","T"],["Historians agree that the word salary comes from salt.","F"],["The French gabelle was abolished in 1790.","T"],["Camel caravans carried salt from Timbuktu to the desert mines.","F"],["Salt was more valuable than gold in Timbuktu.","NG"]]},{"k":"mc","items":[["Hallstatt is mentioned to show",["how long salt has been mined.","that salt was traded to Rome.","that salt towns were rich.","that salt was first found in Austria."],"A"],["Why was salt exchanged for gold in West Africa?",["Salt was lighter than gold.","Timbuktu had no other trade goods.","Gold could not be carried by camel.","The forest regions to the south had gold but little salt."],"D"],["What triggered protest across India in 1930?",["The signing of a treaty.","Gandhi collecting natural salt from the shore.","A rise in the price of salt.","The arrest of Gandhi at Dandi."],"B"],["What is the main health concern about salt today?",["Shortages in poor countries.","Pollution from salt mines.","Too much salt raises blood pressure.","Road salt contaminates drinking water."],"C"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["Roman roads such as the Via Salaria carried salt to the ___.","capital"],["The French salt tax was called the ___.","gabelle"],["Salt from desert mines such as ___ was carried by camel to Timbuktu.","Taghaza"],["About ___ percent of the world's salt goes into food.","6"]]}]},{"title":"Noise Pollution in Cities","paras":["Noise is measured in decibels, a logarithmic scale on which an increase of 10 decibels is heard as roughly twice as loud. A quiet library registers about 40, ordinary conversation about 60 and a busy road about 80. The World Health Organization recommends that average road-traffic noise at people's homes stay below 53 decibels, a level that many city dwellers exceed every day.","The harm goes beyond irritation. Long exposure to traffic noise is associated with raised blood pressure and heart disease, even among people who say they are not bothered by it. Noise at night fragments sleep, and the body responds as if to a threat, releasing stress hormones. Studies of schools near airports have found that children there read less well than children in quieter areas.","The scale is large. The European Environment Agency estimates that about one in five Europeans lives with noise levels that harm health, and the WHO has calculated that traffic noise costs Western Europe at least a million years of healthy life each year. Most of the burden falls on people who live beside busy roads, who are often those with the lowest incomes.","The cheapest remedies deal with the source. Low-noise road surfaces can cut tyre noise by several decibels, and a speed limit of 30 kilometres an hour, in place of 50, reduces both engine and tyre noise. Electric vehicles are quiet at low speed, which helps in residential streets, but above about 30 kilometres an hour most noise comes from tyres on the road, so the gain is smaller on faster roads.","Cities have also begun to use enforcement and design. Paris has tested noise cameras that record vehicles louder than the legal limit. Planners place buildings so that shops or offices screen homes from the road, and ensure that bedrooms face the quieter side. Green walls and hedges look pleasant but do little to reduce noise, a point that is often misunderstood."],"groups":[{"k":"yn","items":[["An increase of 10 decibels sounds roughly twice as loud.","Y"],["People who say they are not bothered by traffic noise are protected from its health effects.","N"],["Wealthier people are more exposed to traffic noise than poorer people.","N"],["Hedges and green walls are an effective way to reduce traffic noise.","N"],["Noise cameras have been shown to reduce traffic noise in every city that uses them.","NG"]]},{"k":"mi","items":[["A description of how noise affects children's learning","B"],["An estimate of the number of Europeans exposed to harmful noise","C"],["An example of enforcement technology","E"],["A comparison between the noise made by electric and conventional vehicles","D"]]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["What kind of scale are decibels measured on?","logarithmic"],["Which organisation recommends keeping road-traffic noise below 53 decibels?","World Health Organization"],["What does the body release in response to night-time noise?","stress hormones"],["What speed limit in kilometres an hour is suggested in place of 50?","30"]]}]},{"title":"How Museums Are Changing","paras":["The public museum was largely a product of the eighteenth and nineteenth centuries, when European states assembled vast collections of art, natural history and antiquities, many gathered through empire. For much of their history, museums presented these objects as a settled body of knowledge, with the curator as the authority and the visitor as the audience.","That model is being questioned. Many museums now give their galleries to the communities whose history they show, inviting local people to help write labels and plan exhibitions. Visitors are encouraged to comment, vote or add their own stories, and some museums describe their role as a meeting place more than a store of treasures.","The most difficult question is who should own what. In 1897, British forces looted thousands of brass and ivory works from the Kingdom of Benin in what is now Nigeria, and they were later sold to museums around the world. In 2022, Germany transferred ownership of more than a thousand of them to Nigeria, and plans are under way for a new museum in Benin City to house returned objects.","Technology has widened access. The Rijksmuseum in Amsterdam lets anyone download high-resolution images of its paintings free of charge and use them for any purpose, from posters to phone cases. Virtual tours and online catalogues allow people who cannot travel to study collections at close range, although curators note that a screen cannot show the size or surface of a work.","Money shapes what museums do. Many depend on shops, cafes and ticket sales for a large share of their income, which encourages them to put on exhibitions that will draw crowds. A few have turned their reputations into products: the Louvre Abu Dhabi, opened in 2017, was built with the Louvre's name and loaned works in exchange for a large payment from the United Arab Emirates, a deal that drew both praise and criticism.","Whether these changes are improvements depends on whom you ask. Supporters say museums are more honest about their past and more welcoming to people who once felt excluded. Critics fear that entertainment is replacing scholarship, and that the pressure to attract visitors will leave less room for objects that need quiet study but little display. Most agree that the balance will differ from one museum to the next."],"groups":[{"k":"hd","heads":["The origins of the public museum","Sharing authority with visitors","Returning looted objects","Opening collections through technology","The influence of income on programming","An unresolved debate about direction","The design of modern museum buildings","The training of museum guides"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["The Rijksmuseum charges a fee for downloaded images.","F"],["Germany transferred ownership of Benin objects to Nigeria in 2022.","T"],["The Louvre Abu Dhabi opened in 2017.","T"],["Most museum visitors prefer virtual tours to physical visits.","NG"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["In which city is a new museum planned for returned objects?","Benin City"],["In what year did British forces loot works from the Kingdom of Benin?","1897"],["Besides size, what can a screen not show of a work, according to curators?","surface"],["Which museum in Amsterdam offers free image downloads?","Rijksmuseum"]]}]}]},{"id":11,"diff":"Hard","passages":[{"title":"The Mystery of Dark Matter","paras":["In 1933 the Swiss astronomer Fritz Zwicky noticed that galaxies in the Coma cluster were moving too quickly to be held together by the gravity of the matter he could see. Either the cluster would fly apart, or most of its mass was invisible. The observation was largely ignored for four decades.","It was revived in the 1970s by Vera Rubin, who measured how fast stars orbit within spiral galaxies. If a galaxy's mass were concentrated where its light is, stars at the edge should move more slowly than those near the centre, as the outer planets of the Solar System move more slowly than the inner ones. Rubin found instead that the speeds stay roughly constant far beyond the visible disc. The simplest explanation was a halo of unseen matter surrounding each galaxy.","Later evidence came from gravitational lensing, in which the gravity of a massive object bends the light passing it, so that the distortion reveals where the mass lies. In the Bullet Cluster, two clusters of galaxies have collided. The hot gas, which makes up most of the visible mass, was slowed by the impact and remains near the centre, but lensing shows that most of the mass has passed through, separated from the gas. This is hard to explain unless much of the mass is a substance that rarely interacts with anything, including itself.","Measurements of the cosmic microwave background, the faint radiation left over from the early universe, have fixed the proportions. Ordinary matter makes up about 5 percent of the universe's total content, dark matter about 27 percent, and dark energy, a separate mystery, the remaining 68 percent. Dark matter does not emit, absorb or reflect light; it is detectable only through its gravity.","Physicists have proposed many candidates, the best known being weakly interacting massive particles, or WIMPs, which would pass through ordinary matter almost without trace. Detectors holding tonnes of liquid xenon, placed deep underground to shield them from cosmic rays, wait for the rare flash that a collision would produce. After decades of increasingly sensitive searches, none has been seen. Interest has therefore shifted toward lighter candidates such as axions and toward other ideas altogether.","A minority of physicists argue that the problem lies with gravity itself. In 1983 Mordehai Milgrom proposed modified Newtonian dynamics, which alters the law of gravity at very low accelerations and reproduces galaxy rotation without any hidden matter. The theory has been successful at the scale of galaxies, but it struggles to account for clusters such as the Bullet Cluster and for the pattern of the cosmic microwave background, and most cosmologists regard dark matter as the better explanation. Neither camp has yet produced a decisive test."],"groups":[{"k":"mc","items":[["What was significant about Rubin's findings?",["Outer stars moved more slowly than inner ones.","Stars were found to move randomly.","Orbital speeds stayed roughly constant well beyond the visible disc.","Spiral galaxies contained more stars than expected."],"C"],["What does the Bullet Cluster show?",["Gas and galaxies can collide without losing speed.","Most of the mass is not where most of the visible matter is.","Lensing is unreliable in collisions.","Dark matter interacts strongly with gas."],"B"],["Why has interest in WIMPs declined?",["They have been proved not to exist.","Experiments have become too expensive to continue.","Increasingly sensitive searches have found nothing.","They cannot be produced in a laboratory."],"C"],["The writer's view of modified Newtonian dynamics is that it",["explains galaxy rotation but not all larger-scale observations.","has been disproved by lensing.","is preferred by most cosmologists.","was never taken seriously."],"A"]]},{"k":"yn","items":[["Zwicky's observation was widely accepted when it was first made.","N"],["Rubin's results were consistent with most of a galaxy's mass lying where its light is.","N"],["Dark matter can be detected directly by the light it emits.","N"],["Searching for WIMPs underground is pointless.","NG"],["Most cosmologists prefer dark matter to a modified law of gravity.","Y"]]},{"k":"cp","limit":"TWO WORDS AND/OR A NUMBER","items":[["Gravitational lensing occurs when the gravity of a massive object bends ___.","light"],["Dark energy accounts for the remaining ___ percent of the universe's content.","68"],["WIMP detectors hold tonnes of ___ placed deep underground.","liquid xenon"],["Milgrom's theory alters the law of gravity at very low ___.","accelerations"]]}]},{"title":"Cognitive Biases in Investing","paras":["Classical finance assumes that investors weigh information coolly and seek the best return for a given risk. Behavioural economists, starting with Daniel Kahneman and Amos Tversky in the 1970s, showed that people systematically depart from this ideal, and that the departures are predictable. Their work gave the study of markets a body of experimental evidence about errors.","The best-known bias is loss aversion. Experiments suggest that the pain of losing a sum of money is roughly twice as strong as the pleasure of gaining the same sum. In investing it produces the disposition effect, the tendency to sell shares that have risen, locking in a gain, while clinging to those that have fallen in the hope of getting back to even. A study of the trading records of about 10,000 accounts at a US brokerage found exactly this pattern, even though the shares that investors sold tended to do better afterward than those they kept.","Overconfidence leads investors to trade too much. In a study of US households, those who traded most earned annual returns several percentage points below the market, because each trade carried a cost and the extra trades did not improve the choice of shares. A later analysis found that men traded more often than women and earned lower returns as a result, a difference attributed to men's greater confidence in their own judgement.","Investors are also influenced by what others do. Herding, in which people copy a crowd without independent analysis, helps inflate bubbles: when prices have risen for years, buying looks safe because everyone else is doing it, and the fear of missing out outweighs the fear of loss. The same instinct reverses in a crash, when selling spreads as quickly as buying did.","Two quieter biases affect individual decisions. Anchoring leads people to treat an arbitrary number, such as the price at which they bought a share, as a reference point for judging value, even though the market has no knowledge of what they paid. Confirmation bias leads them to seek out and believe information that supports a position they already hold, so that an investor who has bought a share reads the optimistic reports and skips the sceptical ones.","Knowing about biases does not remove them, and researchers therefore emphasise structure over willpower. Automatic monthly contributions to a diversified fund remove the temptation to time the market. Written rules, such as selling only when the original reason for buying no longer holds, limit emotional decisions. Waiting a day before any trade is a simple device that costs nothing. None of these removes bias, but each makes the costliest mistakes harder to make."],"groups":[{"k":"mf","title":"List of biases","list":["Loss aversion","Overconfidence","Herding","Anchoring","Confirmation bias"],"items":[["An investor treats the price paid for a share as a reference point for its value.","D"],["People buy because prices have risen for years and others are buying.","C"],["An investor reads only the optimistic reports about a share already owned.","E"],["People trade more often than is good for their returns.","B"],["Losing a sum feels worse than gaining the same sum feels good.","A"]]},{"k":"tf","items":[["The shares that investors sold did worse afterward than the shares they kept.","F"],["Women traded less often than men in the later analysis.","T"],["The disposition effect was first identified by Kahneman and Tversky.","NG"],["Waiting a day before trading removes bias completely.","F"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["The pain of a loss is roughly ___ as strong as the pleasure of an equal gain.","twice"],["During a bubble, the fear of ___ can outweigh the fear of loss.","missing out"],["Automatic monthly contributions to a ___ fund remove the temptation to time the market.","diversified"],["Researchers emphasise structure over ___.","willpower"]]}]},{"title":"Language Death and Revival","paras":["There are about 7,000 languages in the world, but they are distributed very unevenly: a few dozen are spoken by most of the population, while hundreds have fewer than a hundred speakers. Linguists estimate that, unless something changes, around half of all languages will disappear by the end of this century, which means roughly one every two weeks.","Languages seldom die by violence. More often parents decide, reasonably, that their children will have better prospects in a dominant language such as English, Spanish or Mandarin. Schooling, television and migration to cities reinforce that decision. In a few generations, children understand the old language but no longer speak it, and when the last fluent elders die, the language goes with them.","The loss is more than a set of words. Languages carry detailed knowledge of local ecology, medicine and history that may never have been written down. Nigeria, with more than 500 languages, shows the scale of what is at stake: many are spoken by small communities and have no standard writing system. Linguists also value each language as evidence of what the human mind can do with grammar, since some have structures found nowhere else.","Hebrew is the standard example of revival. By the nineteenth century it was used only for prayer and scholarship. Eliezer Ben-Yehuda, who settled in Palestine in 1881, insisted on speaking it at home, coined new words for everyday objects and compiled a dictionary. Hebrew was later adopted as an official language of the region, and today about nine million people speak it as a first or second language.","Other revivals have been slower and more modest. In Wales, laws passed in 1993 and later gave Welsh equal status with English in public life, and Welsh-medium schools now teach tens of thousands of children. Even so, the share of residents who speak Welsh has remained below a fifth. In New Zealand, Maori communities created language nests in the 1980s, preschools run by fluent elders in which children heard nothing but Maori. The model has since been copied in Hawaii and elsewhere.","Success depends less on law than on use. A language taught only at school tends to remain a subject; one spoken at home and on the street becomes a first language. Researchers therefore stress the importance of adults who have learnt the language passing it to children, and of giving the language functions that people value, such as employment or entertainment. Some communities have developed apps, television series and online dictionaries to meet young speakers where they already spend their time."],"groups":[{"k":"hd","heads":["The scale of linguistic extinction","How communities gradually stop using a language","What is lost along with a language","A famous case of complete revival","Partial successes elsewhere","The importance of everyday use","The origins of writing systems","Government attempts to ban languages"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Most languages die as a result of deliberate violence.","N"],["Languages with few speakers may contain knowledge that has not been written down.","Y"],["The Welsh language has been fully revived.","N"],["Teaching a language only in schools is enough to make it a community's first language.","N"]]},{"k":"sa","limit":"TWO WORDS AND/OR A NUMBER","items":[["Who insisted on speaking Hebrew at home after settling in Palestine in 1881?","Eliezer Ben-Yehuda|Ben-Yehuda"],["What did Maori communities create in the 1980s for young children?","language nests"],["In what year were the first laws passed that gave Welsh equal status with English?","1993"],["Besides employment, what valued function can be given to a language?","entertainment"]]}]}]},{"id":12,"diff":"Hard","passages":[{"title":"CRISPR and Crop Improvement","paras":["Plant breeders have always changed crops by selecting chance mutations, a slow process that can take a decade or more to fix a useful trait. CRISPR gene editing aims to shorten that process. The technique was adapted in 2012 by Jennifer Doudna and Emmanuelle Charpentier from a defence system in bacteria, and the two shared a Nobel Prize in 2020.","In outline, the method works like a pair of molecular scissors guided by a sequence. A short piece of guide RNA is designed to match one stretch of the plant's DNA, and it leads an enzyme, Cas9, to that exact spot, where the enzyme cuts both strands. The cell repairs the break, and the repair is often imperfect, so a few letters are lost or changed. If the target is a gene that makes a plant vulnerable to disease, the small error can disable it.","This differs from the older technique of genetic modification, in which a gene from another species is inserted into a crop. A plant edited by CRISPR can end up with no foreign DNA at all, and the change may be indistinguishable from one that arose naturally. Supporters argue that the products should therefore be regulated by their traits, not by the method used to create them. Opponents reply that the process itself carries risks, including edits at unintended sites, that deserve scrutiny.","Regulators have split. The United States and Argentina treat most edited crops that contain no foreign DNA as conventional. In 2018 the European Court of Justice ruled that edited organisms fall under the strict rules for genetically modified ones, and the European Union has been debating relaxation since. Japan approved an edited tomato with raised levels of a calming compound in 2021, the first such food on the market. Several African governments, including those of Nigeria and Kenya, have issued guidelines that treat edited crops case by case.","Researchers are pursuing traits that matter to small farmers: wheat resistant to powdery mildew, rice that matures faster, and bananas resistant to a soil fungus that threatens the main export variety. Because edits can be made to local varieties directly, a farmer need not switch to an imported seed with other traits that may not suit local conditions. In principle this makes the technology useful in places where large seed companies see little profit.","Practical barriers remain. Patents on the underlying technique have been disputed for years, and licensing fees could put the tools beyond public research programmes. Most important traits, such as drought tolerance, depend on many genes, and editing several at once is difficult. Public acceptance is also uncertain: surveys find that opinion varies from country to country, and that many people who accept the science still distrust the companies that sell the seed."],"groups":[{"k":"tf","items":[["CRISPR was adapted from a defence system found in bacteria.","T"],["Cas9 is the guide RNA that matches a stretch of the plant's DNA.","F"],["A crop edited with CRISPR must always contain DNA from another species.","F"],["The edited tomato approved in Japan has a higher yield than conventional tomatoes.","NG"],["The European Court of Justice ruled in 2018 that edited organisms fall under the rules for genetically modified ones.","T"]]},{"k":"mc","items":[["According to paragraph B, an edit often disables a gene because",["the enzyme destroys the whole plant cell.","the cell's repair of the cut is frequently imperfect.","the guide RNA replaces the original DNA.","Cas9 inserts a gene from another species."],"B"],["Supporters of regulation by trait argue that",["edited plants are always safer than modified ones.","method matters more than the final product.","an edited plant may be indistinguishable from a natural variant.","all gene-edited crops should be banned."],"C"],["What advantage does the writer suggest for editing local varieties directly?",["Farmers need not adopt imported seed that may not suit local conditions.","Edited varieties always yield more than imported ones.","Large seed companies profit more from local varieties.","Local varieties contain no foreign DNA."],"A"],["The writer's tone about the future of the technology is",["uncritically enthusiastic.","dismissive of its claims.","balanced between promise and obstacles.","hostile towards seed companies."],"C"]]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["Which two people adapted CRISPR in 2012? (give one surname)","Doudna|Charpentier"],["What type of plant disease is wheat being bred to resist?","powdery mildew"],["In what year did Japan approve an edited tomato?","2021"],["What do disputed patents threaten to put beyond public research programmes?","the tools|tools"]]}]},{"title":"Informal Settlements and Urban Planning","paras":["More than a billion people live in informal settlements, areas where housing is built without formal permission or on land to which the residents hold no legal title. In sub-Saharan Africa about half of the urban population lives in this way. These places are often dismissed as problems to be cleared, but their residents are mostly workers whose labour keeps the formal city running.","For decades the standard response was demolition. Governments moved residents to housing on the edge of the city, where land was cheaper, and the results were usually poor. Distance from jobs added hours and costs to daily travel, and many families sold their new flats and returned to informal areas closer to work. Forced evictions also destroyed the savings that people had put into their homes.","An influential alternative holds that secure ownership would unlock the value in informal homes. The economist Hernando de Soto argued that residents hold what he called dead capital, assets that cannot be used as collateral because no legal record exists. Granting titles, he argued, would let the poor borrow, invest and escape poverty. Several governments adopted titling programmes on this reasoning.","The evidence is more mixed. A study in Buenos Aires took advantage of an unusual natural experiment: some squatters on one piece of land received titles, while others, living on land whose owners contested the transfer, did not. Families with titles invested more in their homes and had fewer children, but there was little increase in their access to bank credit, since banks remained reluctant to lend to low-income borrowers even with a title as collateral.","Other approaches work with the settlement. Upgrading programmes install water, sewers, paved lanes and lighting, leaving buildings and neighbours in place. In Thailand, the Baan Mankong programme, begun in 2003, lends money directly to organised community groups, which plan and manage improvements themselves. The cost per household is generally lower than rebuilding, and residents keep their social networks and workplaces.","Upgrading is not free of difficulties. Better services can raise rents and push out the poorest tenants, who rarely benefit from titles that go to owners. Planners therefore increasingly combine physical upgrading with protection for tenants, and with permission for owners to add rooms or floors, since renting out space is how many households earn a living. No single method suits every city, and most successful programmes have been adjusted repeatedly as conditions changed."],"groups":[{"k":"mi","items":[["A reason why relocation housing failed to meet residents' needs","B"],["A summary of the argument for granting titles","C"],["A description of a programme managed by the residents themselves","E"],["A warning that improvements can harm some residents","F"],["An estimate of how many people live in informal settlements","A"]]},{"k":"yn","items":[["Most residents of informal settlements are workers whose labour supports the formal city.","Y"],["Title deeds led to a large increase in bank lending in the Buenos Aires study.","N"],["Upgrading generally costs less per household than rebuilding.","Y"],["Governments should abandon titling programmes.","NG"]]},{"k":"sm","limit":"TWO WORDS","text":"In Buenos Aires, families with titles ___ more in their homes, but their access to ___ barely changed. In Thailand, the Baan Mankong programme lends money to organised ___, which plan the improvements themselves. Better services can raise ___ and push out the poorest tenants.","answers":["invested","bank credit","community groups","rents"]}]},{"title":"The Economics of Free Trade Agreements","paras":["A free trade agreement is a treaty in which two or more countries agree to cut or remove tariffs on goods traded between them. The economic case rests on comparative advantage, an idea developed by David Ricardo in the early nineteenth century: even when one country is better at making everything, both gain if each concentrates on what it does relatively best and trades for the rest.","Consumers are the most obvious beneficiaries, because cheaper imports lower prices and widen choice. Firms gain access to larger markets and can spread fixed costs over more sales, and competition from abroad pushes domestic producers to become more efficient. Studies of tariff reductions often find productivity gains in the industries that face the greatest import competition.","The gains are not evenly shared. Economists who studied the surge of Chinese imports into the United States after 2000 estimated that it cost between two and two and a half million American jobs, concentrated in particular towns whose factories closed. Workers in those places did not simply move to new jobs; many left the workforce or took lower pay for years. The aggregate benefits of trade were real, but those who lost out lived in different places from those who gained.","Agreements can also distort trade. When members cut tariffs only among themselves, buyers may switch from a cheaper outside supplier to a dearer member, a process economists call trade diversion. Overlapping agreements with different rules of origin, the rules that decide which goods qualify for lower tariffs, create what one economist called a spaghetti bowl, in which exporters must work through many sets of paperwork.","The African Continental Free Trade Area, which came into force in 2021, aims to join 54 countries into a single market of about 1.3 billion people. Trade between African countries makes up only around 15 percent of their total trade, compared with about 60 percent in Asia and 68 percent in Europe. The World Bank has estimated that full implementation could lift roughly 30 million people out of extreme poverty by 2035, mostly because the agreement addresses not only tariffs but also trade facilitation, the border delays and paperwork that often cost more than tariffs do.","Whether such benefits arrive depends on implementation. Customs systems must be modernised, roads and ports improved, and negotiators must agree rules of origin that are strict enough to prevent outside goods entering through the lowest-tariff member but not so strict that small exporters cannot comply. Governments also have to decide how to support workers and regions that lose protection. History suggests that agreements which ignore the losers tend to meet political resistance that can undo the gains."],"groups":[{"k":"hd","heads":["The theory behind trade liberalisation","Who gains from lower tariffs","An uneven distribution of costs","Unintended effects of preferential deals","A continental project and its estimated benefits","What must happen for benefits to be realised","The history of customs duties","Why exchange rates fluctuate"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["Ricardo argued that a country gains from trade only if it is better at producing every good.","F"],["Trade between African countries makes up about 15 percent of their total trade.","T"],["The African Continental Free Trade Area covers all 55 members of the African Union.","F"],["Chinese imports caused a decline in United States exports after 2000.","NG"]]},{"k":"cp","limit":"ONE WORD","items":[["When buyers switch from a cheaper outside supplier to a dearer member, economists call this trade ___.","diversion"],["Rules of origin decide which goods ___ for lower tariffs.","qualify"],["The World Bank estimated that roughly 30 million people could be lifted out of ___ poverty by 2035.","extreme"],["Border delays and paperwork are known as trade ___.","facilitation"]]}]}]},{"id":13,"diff":"Hard","passages":[{"title":"The Placebo Effect","paras":["In 1955 the American anaesthetist Henry Beecher published a paper called 'The Powerful Placebo', reporting that about a third of patients in various trials improved after receiving an inert treatment. The figure was later criticised, because patients often improve without any treatment at all and Beecher had no way of separating the two. Even so, the paper established the placebo as a subject for serious study.","Better-designed research has shown that the effect is real but narrow. Placebos reliably reduce pain, nausea and fatigue, and they help in conditions such as depression and irritable bowel syndrome, where symptoms are partly shaped by how a patient feels. They do not shrink tumours or cure infections. Placebo responses alter how symptoms are experienced, not the course of the disease itself.","Brain imaging suggests why. When a patient expects relief from pain, the brain releases its own opioids, the natural painkillers, and a drug that blocks those opioids, naloxone, also blocks the placebo effect. Expectation is shaped by many cues. A study found that an expensive painkiller worked better than an identical cheap one, capsules are judged stronger than tablets, and injections stronger still.","Some of the most striking evidence comes from surgery. In one trial, patients with painful knee osteoarthritis were randomly assigned to have the joint cleaned out through keyhole incisions or to have only incisions made while under anaesthetic. Two years later the two groups reported the same relief. Because a sham operation carries real risks, such trials are rare, but this one led many surgeons to question a common procedure.","The reverse also occurs. The nocebo effect, in which negative expectations produce symptoms, accounts for many of the side effects people report. In a large trial of a cholesterol-lowering drug, participants took the drug for some months and dummy pills for others. They reported muscle pain at almost identical levels in both periods, and the pain on the dummy pill was nearly as intense as on the real one.","A puzzling feature is that placebo responses have been rising in some trials, particularly of painkillers in the United States, making it harder for new drugs to show a benefit. It has also prompted a question of ethics. If a placebo works, may a doctor prescribe one? Experiments with open-label placebos, which patients know to be inert, have found benefits for irritable bowel syndrome and back pain, which suggests that deception may not be necessary, though the trials are small."],"groups":[{"k":"mi","items":[["A description of a natural chemical released when relief is expected","C"],["A criticism of an influential early study","A"],["A question about whether doctors should prescribe placebos","F"],["A report that a procedure was no better than an imitation","D"]]},{"k":"yn","items":[["Beecher's estimate of the placebo response has been fully confirmed by later research.","N"],["Placebos can shrink tumours.","N"],["The nocebo effect explains some of the side effects that patients report.","Y"],["Surgeons stopped performing knee operations altogether after the trial.","N"],["Open-label placebos have been proved to work for all conditions.","N"]]},{"k":"sa","limit":"TWO WORDS","items":[["What natural painkillers does the brain release when relief is expected?","opioids"],["Which drug blocks the placebo effect on pain?","naloxone"],["Which condition affected the knees of the patients in the surgical trial?","osteoarthritis"],["In which country have placebo responses in painkiller trials been rising?","United States"]]}]},{"title":"Brutalism and the Reappraisal of Concrete","paras":["Few architectural styles divide opinion as sharply as Brutalism. Its name does not come from brutality but from the French beton brut, raw concrete, a term Le Corbusier used for the rough, board-marked finish of his Unite d'Habitation in Marseille, completed in 1952. In the mid-1950s the British architects Alison and Peter Smithson adopted the word for an approach that rejected decoration and showed materials and structure as they were.","The style flourished because of a postwar need. Governments in Europe, North America and newly independent states required housing, universities, libraries and civic buildings, quickly and at modest cost. Concrete could be poured on site by relatively unskilled labour, could be moulded into almost any shape and needed no paint or cladding. Architects also saw moral value in a building that concealed nothing, which they contrasted with the ornament of earlier styles.","Many Brutalist projects were meant to be more than monuments. Housing estates such as the Barbican in London, completed in the 1970s, combined flats with a concert hall, school and gardens, and were designed to fit a whole community into a compact area. Public architecture also carried national ambitions: the National Theatre in Lagos, completed in 1976, was built to host the 1977 World Black and African Festival of Arts and Culture.","By the 1980s the style had few defenders. Concrete weathered badly in wet climates, streaked with rainwater and stained, and poor maintenance made leaks and cracks worse. Estates that had been built with high hopes were stigmatised by crime and neglect, and critics blamed the architecture itself, though inadequate funding and management had at least as much to do with their fate. Many buildings were demolished, and others were left to decay.","Opinion has since shifted. A new generation, attracted by the bold shapes and by photographs shared online, has rediscovered the style, and conservation groups have campaigned to protect the best examples. Preston Bus Station in England, which the local council had planned to demolish, was given protected status in 2013 and later restored. Not every campaign succeeded, however: Robin Hood Gardens, a London estate admired by many architects, was largely demolished from 2017.","The debate now concerns what preservation involves. Concrete is not permanent: it cracks, and moisture reaches the steel inside, which rusts and expands. Repairing it without changing its look is costly, and some owners argue that keeping a building should not require the public to subsidise a style that many still dislike. The question is not only whether the buildings are beautiful but who should pay to maintain buildings that were designed to be cheap and plain, not precious."],"groups":[{"k":"hd","heads":["The origin of a name and a philosophy","The conditions that favoured a material","Ambitions beyond individual buildings","Reasons for falling out of favour","A change in attitudes and its limits","The difficulty of keeping concrete in good condition","The influence of Brutalism on landscape design","The role of women architects in the movement"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"tf","items":[["The word Brutalism comes from a French term meaning raw concrete.","T"],["Concrete had to be poured on site by skilled labour.","F"],["Brutalist buildings are more expensive to heat than buildings in other styles.","NG"],["Preston Bus Station was demolished in 2013.","F"]]},{"k":"cp","limit":"TWO WORDS AND/OR A NUMBER","items":[["Le Corbusier used the term for the rough, ___ finish of his Unite d'Habitation.","board-marked"],["The National Theatre in Lagos was completed in ___.","1976"],["Moisture reaches the steel inside concrete, which ___ and expands.","rusts"]]}]},{"title":"Ocean Acidification","paras":["The ocean has absorbed roughly a quarter of the carbon dioxide that humans have released since the Industrial Revolution. This has softened the effect of the gas on the atmosphere, but it has not been free. Carbon dioxide dissolves in seawater to form carbonic acid, and the surface ocean has become about 30 percent more acidic, a change that chemists express as a fall in pH from about 8.2 to about 8.1.","A fall of 0.1 in pH looks trivial, but the scale is logarithmic and the change is rapid. The more important effect is not on the acid itself but on carbonate ions, which many marine animals combine with calcium to build shells and skeletons. As acidity rises, carbonate ions become scarcer, and building a shell requires more energy. In sufficiently acidic water, existing shells begin to dissolve.","Cold water absorbs more carbon dioxide than warm water, so the polar oceans are changing fastest. Pteropods, small free-swimming snails that form a key part of the food chain in the Southern Ocean and the North Pacific, have been found with shells that are visibly pitted after exposure to water that is under-saturated in carbonate. Because they are eaten by fish such as salmon, a decline could be felt far above them in the food web.","The first commercial warning came from shellfish farms. Between 2007 and 2009, oyster hatcheries on the Pacific coast of the United States saw larvae die in large numbers. Scientists traced the cause to deep, carbon-rich water that wells up along that coast and had become corrosive to larvae in the first days of their lives, when they must form their first shells. Hatcheries responded by monitoring the water chemistry and adding sodium carbonate to buffer it, and production recovered.","Not every species loses. Seagrasses and some algae use dissolved carbon dioxide for photosynthesis and may grow faster. Some fish alter their behaviour in more acidic water, which affects their ability to avoid predators, but experiments disagree about the size of the effect, and some results have not been reproduced. Researchers therefore warn against predicting a simple pattern of winners and losers.","Geological records show that the oceans have acidified before, most notably some 56 million years ago, and that many deep-sea species died out then. The difference is the speed: the present change is far faster than anything in the record, leaving little time for evolution to respond. Local measures, such as restoring seagrass meadows, may give some protection to nearby shellfish beds, but only cuts in carbon dioxide emissions address the cause."],"groups":[{"k":"tf","items":[["The ocean has absorbed about a quarter of the carbon dioxide released by humans.","T"],["A fall of 0.1 in pH represents a trivial change in acidity.","F"],["The polar oceans are changing more slowly than tropical ones.","F"],["Experiments agree about how much acidity affects fish behaviour.","F"],["Pteropods are the main food of Pacific salmon.","NG"]]},{"k":"m2","q":"Which TWO measures helped oyster hatcheries to recover?","opts":["monitoring the water chemistry","moving the hatcheries inland","adding sodium carbonate to the water","importing larvae from other countries","planting seagrass nearby"],"ans":"AC"},{"k":"sb","bank":["carbonate","calcium","cold","larvae","algae","acid","shells","salmon"],"text":"As the ocean absorbs carbon dioxide, ___ ions become scarcer, making it harder for animals to build shells. Polar waters change fastest because ___ water absorbs more gas than warm water. Oyster ___ were harmed on the Pacific coast of the United States by corrosive deep water, while seagrasses and some ___ may benefit from extra dissolved carbon dioxide.","answers":["carbonate","cold","larvae","algae"]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["What chemical was added to hatchery water to buffer it?","sodium carbonate"],["How long ago did a major earlier episode of acidification occur?","56 million years|56 million"],["What local measure may protect nearby shellfish beds?","restoring seagrass meadows|seagrass meadows"]]}]}]},{"id":14,"diff":"Hard","passages":[{"title":"Memory Palaces and Mnemonics","paras":["According to Roman tradition, the technique began with a disaster. The poet Simonides was dining at a banquet when he was called outside, and in his absence the roof collapsed and crushed the other guests so badly that relatives could not identify them. Simonides found that he could name each victim by recalling where he had been sitting. He concluded that order and place are the best aids to memory.","The method of loci, as the Romans called it, uses this insight. A person chooses a familiar place, such as the rooms of a house, and fixes a route through it. Each item to be remembered is converted into a vivid image and placed at a particular spot along the route. To recall the list, the person walks the route in imagination and collects the images in order. Roman orators used it to deliver long speeches without notes.","Modern interest was boosted by research into memory champions, who can memorise the order of a shuffled pack of cards in under twenty seconds. A brain-imaging study found that their brains were not structurally different from other people's and that their scores on general tests were ordinary. What distinguished them was that, during memorisation, they activated regions concerned with spatial memory, and almost all reported using a memory palace.","The more important finding came when researchers trained ordinary volunteers. After six weeks of daily practice, people who could initially recall about 26 words from a list of 72 were recalling an average of about 62, and the improvement was still present four months later. Brain scans showed that connections between regions had strengthened, which suggests that the skill is learnt, not innate.","The technique has limits. It is designed for items in a sequence, such as a list of dates or the order of cranial nerves, and is less suited to ideas whose meaning matters more than their order. Building the images takes time, and a palace used again and again risks confusion between old and new items, so many users keep several. Educators also point out that a student who memorises facts without understanding them has little to build on.","Even so, the method reveals something about the mind. Humans evolved to find their way in physical space, and spatial memory appears unusually robust and detailed. London taxi drivers, who must learn thousands of streets, have been found to have a larger rear portion of the hippocampus, a region involved in spatial memory, than other people. The memory palace may work because it borrows a system that was already strong, in place of building a new one."],"groups":[{"k":"mi","items":[["An account of a legend about the origins of the technique","A"],["Evidence that the skill can be taught to ordinary people","D"],["A description of the steps involved in using the technique","B"],["A reference to a limitation concerning types of information","E"],["An example of a group whose brains show effects of spatial learning","F"]]},{"k":"yn","items":[["Memory champions have brains that differ structurally from those of other people.","N"],["The improvement in recall among trained volunteers disappeared within a month.","N"],["The writer believes a memory palace is the best way to learn any subject.","N"],["Students should avoid memorising facts.","NG"]]},{"k":"cp","limit":"ONE WORD AND/OR A NUMBER","items":[["Roman orators used the method to deliver long speeches without ___.","notes"],["After six weeks, volunteers recalled an average of about ___ words.","62"],["Users keep several palaces to avoid ___ between old and new items.","confusion"],["London taxi drivers have a larger rear portion of the ___.","hippocampus"]]}]},{"title":"The Economics of Housing Supply","paras":["In most large cities, housing costs have risen faster than incomes for decades, and the usual explanation is demand: people want to live where jobs are. Economists point out that demand alone cannot raise prices over the long term if supply responds. When the price of an apartment rises, builders should build more, and the extra homes should bring prices down.","In many places supply does not respond, and the cause is usually regulation. Zoning rules limit the height and density of buildings, require minimum plot sizes and mandate parking. Approval processes can take years and give neighbours a way to block projects. Each rule has a rationale, such as protecting light, traffic or character, but together they can make it impossible to build what the market would supply.","Cities that have limited this local veto have seen different results. Tokyo, where national rules set the zoning categories and local councils have little power to block permitted projects, builds large numbers of homes every year, and its rents and prices have risen far more slowly than those in London or San Francisco. The comparison is imperfect, since Japan's population is falling, but it supports the view that rules matter.","Economists also dispute the effect of new building on affordability. Critics say that new apartments are luxury products that do not help people on low incomes. Defenders reply that wealthy newcomers who cannot find a new flat will bid for older ones, pushing out poorer tenants, so that adding any housing eases pressure all the way down the market. Studies of new buildings in several cities have found that nearby rents fall or rise more slowly than elsewhere.","Rent control is the best-known alternative policy and the most contested. By capping increases, it protects sitting tenants from sudden rises. A study of San Francisco, however, found that landlords whose buildings were covered reduced the supply of rental housing by around 15 percent, by selling or converting units, and that the resulting loss of rental homes pushed rents up across the city. Most economists conclude that rent control helps those who already have a home at the expense of those who are seeking one.","The problem is acute in fast-growing cities in developing countries. Nigeria's housing deficit is commonly put at more than 17 million homes, and the gap is filled largely by informal building. There, the obstacles are different: unclear land titles, high costs of materials and finance that few buyers can obtain. Even so, the lesson from richer cities is that supply is shaped as much by rules and institutions as by the cost of bricks."],"groups":[{"k":"hd","heads":["A conventional explanation and its weakness","How rules limit construction","Evidence from a city with fewer local vetoes","A dispute about who benefits from new homes","The side effects of capping rents","Different obstacles in poorer countries","The environmental cost of concrete","The history of mortgage lending"],"items":[["A",1],["B",2],["C",3],["D",4],["E",5],["F",6]]},{"k":"yn","items":[["Demand alone can explain why house prices stay high over many years.","N"],["The writer believes the Tokyo comparison proves that zoning rules explain the difference in rents.","N"],["Most economists believe rent control helps people who are seeking a home.","N"],["Nigeria's housing deficit is larger than that of any other African country.","NG"]]},{"k":"sa","limit":"THREE WORDS AND/OR A NUMBER","items":[["Besides minimum plot sizes, what do zoning rules often mandate?","parking"],["By what percentage did covered San Francisco landlords reduce the supply of rental housing?","15 percent|15%"],["What fills the gap in housing supply in Nigeria?","informal building"]]}]},{"title":"Quantum Computing Basics","paras":["A classical computer stores information in bits, each of which is either 0 or 1. A quantum computer uses qubits, which can be placed in a superposition, a state in which a measurement has some probability of giving 0 and some of giving 1. Until it is measured, the qubit is described by both possibilities at once, and a register of qubits can represent many combinations simultaneously.","This is often summarised as quantum computers trying all answers at once, which is misleading. When a quantum register is measured, it collapses to a single result, and the result is random. The art of quantum programming lies in arranging the computation so that the paths leading to wrong answers cancel each other out, while those leading to the right one reinforce it, a process called interference. Only a few problems are known to allow this.","One of them is factoring large numbers. In 1994 the mathematician Peter Shor described an algorithm that could factor numbers exponentially faster than any known classical method. Much of modern internet security relies on the difficulty of that task, so a large enough quantum computer could break widely used encryption. Another algorithm, by Lov Grover, speeds up searches through unsorted data, but only by a quadratic factor, which is useful rather than revolutionary.","The machines are hard to build. Qubits are fragile: heat, vibrations or stray radiation can disturb them, a problem known as decoherence. Superconducting designs are cooled to a few hundredths of a degree above absolute zero, colder than outer space. Error correction is therefore essential, and it is expensive: estimates suggest that one reliable logical qubit may need around a thousand physical ones, while today's machines have hundreds to a few thousand of the physical kind.","Claims of progress need care. In 2019, Google reported that its 53-qubit processor had completed in about 200 seconds a task that it estimated would take the best supercomputer 10,000 years. IBM replied that a better classical method could do it in days. Such demonstrations show that quantum devices can outperform classical ones on contrived tasks, but they do not yet show an advantage on problems that anyone needs solved.","The most promising uses may be scientific. Simulating molecules is hard for classical machines, because the number of quantum states grows exponentially with the size of the molecule. Quantum computers could help to design catalysts, batteries and drugs. Meanwhile, security agencies worry that adversaries are already storing encrypted data in the hope of decrypting it later, and in 2024 the United States standards body NIST published its first encryption standards designed to resist quantum attack."],"groups":[{"k":"mc","items":[["According to paragraph B, the idea that quantum computers try all answers at once is",["accurate for every problem.","misleading, because a m
